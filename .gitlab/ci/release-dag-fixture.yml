# Exercise config child/freezer -> route child -> native leaf without
# candidate selection, using only the existing Stage 1 status fixture.
'Compile nested DAG fixture':
  stage: 'Build'
  needs: ['Check release DAG fixture selection']
  image: 'registry.gitlab.joyfullee.me/nest/tools/agent@sha256:820cc8a130309a07db90685958bb9cac87d8376ab63f2d45457e87431ad93e34'
  tags: ['owl']
  script:
    - 'env -u HOSTNAME python3 scripts/nest-release-dag-fixture.py --compile-nested'
  artifacts:
    when: on_success
    paths: ['nested-dag-fixture/']
  rules: &nested_fixture_rules
    - if: *fixture_conflicts
      when: never
    - if: *host_conflicts
      when: never
    - if: '($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web") && ($NEST_DAG_FIXTURE == "nested-stage1-pass" || $NEST_DAG_FIXTURE == "nested-stage1-fail")'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && ($NEST_DAG_FIXTURE == "node-stage1-pass" || $NEST_DAG_FIXTURE == "node-stage1-fail")'

'Run nested DAG fixture':
  stage: 'Deploy'
  needs: ['Compile nested DAG fixture']
  allow_failure: false
  inherit:
    variables: false
  trigger:
    include:
      - artifact: 'nested-dag-fixture/child.yml'
        job: 'Compile nested DAG fixture'
    strategy: mirror
    forward:
      yaml_variables: false
      pipeline_variables: false
  rules: *nested_fixture_rules

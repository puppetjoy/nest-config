---
# A real multi-project status edge, deliberately separate from release execution.
'Release DAG policy tests':
  extends: .all-branch-ci
  stage: 'Test'
  image: 'python:3.12-slim@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2'
  tags: ['owl']
  script:
    - |
      /usr/local/bin/python3 -I -B - <<'PY'
      import hashlib
      import io
      import json
      import os
      import re
      import tarfile
      import urllib.request
      from pathlib import Path

      class NoRedirect(urllib.request.HTTPRedirectHandler):
          def redirect_request(self, *args, **kwargs):
              return None

      base = 'https://gitlab.joyfullee.me/api/v4'
      req = urllib.request.Request(base + '/job', headers={'JOB-TOKEN': os.environ['CI_JOB_TOKEN']})
      opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
      with opener.open(req, timeout=15) as response:
          job = json.load(response)
      pipeline = job['pipeline']
      sha = pipeline['sha']
      if not (pipeline['project_id'] == 3 and job['name'] == 'Release DAG policy tests'
              and re.fullmatch(r'[0-9a-f]{40}', sha) and job['commit']['id'] == sha
              and str(job['id']) == os.environ['CI_JOB_ID'] and sha == os.environ['CI_COMMIT_SHA']):
          raise SystemExit('Release DAG policy job identity does not match')
      limit = 32 * 1024 * 1024
      with opener.open(base + '/projects/3/repository/archive.tar.gz?sha=' + sha, timeout=30) as response:
          data = response.read(limit + 1)
      if len(data) > limit:
          raise SystemExit('Release DAG policy source archive too large')
      target = Path('.release-dag-archive')
      target.mkdir(mode=0o700)
      with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
          archive.extractall(target, filter='data')
      roots = list(target.iterdir())
      if len(roots) != 1 or roots[0].is_symlink() or not roots[0].is_dir():
          raise SystemExit('Release DAG policy archive must have one source directory')
      (target / 'source').write_text(str(roots[0].resolve()) + '\n')
      print(f'Policy inputs: job {job["id"]}, commit {sha}, archive SHA-256 {hashlib.sha256(data).hexdigest()}')
      PY
    - 'cd "$(cat .release-dag-archive/source)"'
    - 'env -i PATH=/usr/local/bin:/usr/bin:/bin python3 -I -m venv .release-dag-venv'
    - 'env -i PATH=/usr/local/bin:/usr/bin:/bin PIP_CONFIG_FILE=/dev/null .release-dag-venv/bin/python -I -m pip install --disable-pip-version-check --require-hashes -r .gitlab/ci/release-dag-requirements.txt'
    - 'env -i PATH="$PWD/.release-dag-venv/bin:/usr/bin:/bin" .release-dag-venv/bin/python -I -B spec/files/nest_release_dag_fixture_test.py'
    - 'env -i PATH="$PWD/.release-dag-venv/bin:/usr/bin:/bin" .release-dag-venv/bin/python -I -B spec/files/ci_scope_policy_test.py'


'Check release DAG fixture selection':
  stage: 'Test'
  image: 'registry.gitlab.joyfullee.me/nest/config/main@sha256:2b6981788cba6f9e9bcdd4c391d17ca812c991e00bcb8ff3a670530226fafbe3'
  tags: ['owl']
  script:
    # Docker exports its container hostname. Caller host selectors were already
    # rejected by bridge rules; do not mistake this runtime identity for one.
    - 'env -u HOSTNAME python3 scripts/nest-release-dag-fixture.py'
  rules:
    - if: '$NEST_DAG_FIXTURE =~ /[\s\S]/'

'Stage 0 release DAG fixture':
  stage: 'Build'
  needs: ['Check release DAG fixture selection']
  allow_failure: false
  inherit:
    variables: false
  trigger:
    project: 'nest/stage0'
    branch: 'main'
    strategy: mirror
    forward:
      yaml_variables: true
      pipeline_variables: false
  rules:
    - if: &fixture_conflicts '$CI_COMMIT_TAG =~ /[\s\S]/ || $RELEASE_INPUTS =~ /[\s\S]/ || $EXECUTOR_ONLY =~ /[\s\S]/ || $BUILD =~ /[\s\S]/ || $CPU =~ /[\s\S]/ || $RUNNER_SMOKE_TAG =~ /[\s\S]/ || $RELEASE_CANDIDATE =~ /[\s\S]/ || $RELEASE_DAG =~ /[\s\S]/ || $RELEASE_DAG_FIXTURE =~ /[\s\S]/ || $RELEASE_VALIDATE_ONLY =~ /[\s\S]/ || $RELEASE_CPU =~ /[\s\S]/ || $RELEASE_MEMBER =~ /[\s\S]/ || $RELEASE_INPUT_JOB_ID =~ /[\s\S]/ || $RELEASE_INPUT_SHA256 =~ /[\s\S]/ || $RELEASE_EXECUTOR_JOB_ID =~ /[\s\S]/ || $RELEASE_EXECUTOR_IMAGE =~ /[\s\S]/ || $FROM_GENTOO =~ /[\s\S]/ || $STAGE0_RESUME =~ /[\s\S]/ || $REFRESH =~ /[\s\S]/ || $NEST_LEGACY_BUILD =~ /[\s\S]/ || $RELEASE_PLATFORM =~ /[\s\S]/ || $PLATFORM =~ /[\s\S]/ || $RELEASE_VARIANT =~ /[\s\S]/ || $VARIANT =~ /[\s\S]/ || $RELEASE_MODE =~ /[\s\S]/'
      when: never
    - if: &host_conflicts '$RELEASE_HOST =~ /[\s\S]/ || $RELEASE_STAGE3_PLACEMENT_FILE =~ /[\s\S]/ || $HOSTNAME =~ /[\s\S]/ || $CLUSTER =~ /[\s\S]/ || $PROFILE =~ /[\s\S]/ || $RELEASE_GRAPH =~ /[\s\S]/ || $RELEASE_GRAPH_FILE =~ /[\s\S]/ || $RELEASE_GRAPH_NODE =~ /[\s\S]/ || $RELEASE_GRAPH_MEMBER =~ /[\s\S]/ || $RELEASE_GRAPH_INPUT_PIPELINE =~ /[\s\S]/ || $RELEASE_GRAPH_INPUT_JOB =~ /[\s\S]/ || $RELEASE_GRAPH_INPUT_SHA256 =~ /[\s\S]/ || $RELEASE_GRAPH_ROOT_PIPELINE =~ /[\s\S]/ || $EXECUTOR_BOOTSTRAP =~ /[\s\S]/ || $RELEASE_BOOTSTRAP_FILE =~ /[\s\S]/ || $RELEASE_BOOTSTRAP_PIPELINE =~ /[\s\S]/ || $RELEASE_BOOTSTRAP_JOB =~ /[\s\S]/ || $RELEASE_BOOTSTRAP_SHA256 =~ /[\s\S]/ || $RELEASE_ROUTE =~ /[\s\S]/ || $RELEASE_ROUTE_MEMBER =~ /[\s\S]/ || $RELEASE_ROUTE_EXECUTOR_PIPELINE =~ /[\s\S]/ || $RELEASE_ROUTE_EXECUTOR_JOB =~ /[\s\S]/ || $RELEASE_ROUTE_PLACEMENT =~ /[\s\S]/'
      when: never
    - if: '($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web") && $NEST_DAG_FIXTURE == "pass"'
      variables:
        RELEASE_DAG: 'true'
        RELEASE_VALIDATE_ONLY: 'true'
        RELEASE_DAG_FIXTURE: 'pass'
    - if: '($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web") && $NEST_DAG_FIXTURE == "fail"'
      variables:
        RELEASE_DAG: 'true'
        RELEASE_VALIDATE_ONLY: 'true'
        RELEASE_DAG_FIXTURE: 'fail'


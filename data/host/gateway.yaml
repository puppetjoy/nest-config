---
# Gateway's retained staged identity uses the new Puppet CA.
puppet::agent_server_hostname: 'puppet.eyrie'

# Preserve active connections while reloading the public ingress configuration.
apache::service_restart: '/bin/systemctl reload apache2.service'

lookup_options:
  nest::service::gitlab_anubis::signing_key:
    convert_to: 'Sensitive'

nest::service::gitlab_anubis::signing_key: 'ENC[PKCS7,]'

nest::classes:
  - 'nest::service::gateway'
  - 'nest::service::reverse_proxy'
  - 'nest::service::gitlab_anubis'

nest::packages:
  - 'app-crypt/certbot'

nest::dvorak: true
nest::vpn: true
nest::openvpn_ssl_directory: '/etc/openvpn/ssl'

nest::reset_filter_rules:
  - '- /etc/openvpn/ssl/'
  - 'P /etc/letsencrypt/**'

nest::service::apache::manage_firewall: true
nest::service::gateway::http: true

nest::service::gateway::port_forwards:
  git:
    dest: '45.77.156.204'
    port: 22
    proto: tcp
    to_addr: '172.21.2.1'
    to_port: 22
    masquerade: 'tun0'
  # streamlabs:
  #   dest: '45.77.156.204'
  #   port: 59650
  #   proto: tcp
  #   to_addr: '172.22.0.9'
  #   to_port: 59650

nest::service::reverse_proxy::hosts:
  gitlab.joyfullee.me:
    destination: '127.0.0.1:8923'
    ip: ['45.77.156.204', '2001:19f0:1000:e1dc::204']
    encoded_slashes: true
    preserve_host: true
    timeout: 600
    websockets: true
    extra_params:
      proxy_add_headers: false
      request_headers:
        - 'unset Forwarded'
        - "set X-Real-IP expr=%{literal('%')}{CONN_REMOTE_ADDR}"
        - "set X-Forwarded-For expr=%{literal('%')}{CONN_REMOTE_ADDR}"
        - 'set X-Forwarded-Proto "https"'
        - 'set X-Forwarded-Host "gitlab.joyfullee.me"'
        - "set X-Http-Version expr=%{literal('%')}{SERVER_PROTOCOL}"
        - 'set X-TLS-SNI-Name "%{literal(''%'')}{SSL_TLS_SNI}s"'
        - 'unset X-Anubis-Rule'
        - 'unset X-Anubis-Action'
        - 'unset X-Anubis-Status'

  registry.gitlab.joyfullee.me:
    destination: 'registry.gitlab.eyrie'
    ip: ['45.77.156.204', '2001:19f0:1000:e1dc::204']
    proxy_ssl: true
    timeout: 3600

  requests.thesatelliteoflove.net:
    destination: 'ombi.nest'
    ip: ['45.77.156.204', '2001:19f0:1000:e1dc::204']
    serveraliases: ['requests.heloandnala.net']

  vault.thesatelliteoflove.net:
    destination: 'bitwarden.eyrie'
    ip: ['45.77.156.204', '2001:19f0:1000:e1dc::204']
    proxy_ssl: true
    websockets: true

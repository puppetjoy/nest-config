---
nest::classes:
  - 'nest::app::codex'
  - 'nest::app::spotify'
  - 'nest::host::falcon'
  - 'nest::service::gitlab_runner'
  - 'nest::service::kubernetes'
  - 'nest::service::kvm'
  - 'nest::service::libvirt'
  - 'nest::service::media'
  - 'nest::service::reverse_proxy'
  - 'nest::tool::bolt::deploy'

# Spotify CEF VP9 faults in iHD's i915 command-buffer mapping. Keep the host
# media stack accelerated; use software video decode only in native Spotify.
# Re-enable after a maintained provider/client fix passes real VP9 playback.
nest::app::spotify::hardware_video_decode: false

nest::dvorak: true
nest::monitor_layout: ['DP-4@0', 'DP-2@2560']
nest::primary_monitor: 'DP-2'
nest::swap_alt_win: true
nest::text_scaling_factor: 1.1

nest::bird_role: server
nest::distcc_server: true
nest::fileserver: true
nest::fscache: false
nest::isolate_smt: true
nest::kexec: true
nest::mta: postfix
nest::public_ssh: true
nest::srv_zpool: data/crypt
puppet::agent_server_hostname: 'puppet.eyrie'

nest::kernel_cmdline:
  - 'console=ttyS1,115200n8'
  - 'console=tty0'
  # Caracara: 16 GiB, strictly split into two 8 GiB NUMA cells.
  - 'hugepagesz=2M'
  - 'hugepages=0:4096,1:4096'
  - 'intel_iommu=on'
  - 'intel_idle.max_cstate=2'
  - 'pci-stub.ids=10de:2882,10de:22be,1912:0014'
  # Arc A750: owner-approved Xe comparison with the small-BAR iHD correction.
  # Keep the complete i915 boot payload and entry available for rollback.
  - 'i915.force_probe=!56a1'
  - 'xe.force_probe=56a1'

# Built-in i915 requests DG2 HuC before the real root filesystem is mounted.
# Dracut's module scan misses it; this repairs firmware availability, not PCI loss.
nest::initramfs_firmware:
  - '/lib/firmware/i915/dg2_huc_gsc.bin'

nest::kernel_config:
  CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE: y
  CONFIG_CPU_FREQ_DEFAULT_GOV_USERSPACE: n
  # PCIe errors were invisible to Linux with AER disabled. Enable diagnosis and
  # the standard recovery path; this does not establish the blackout trigger.
  CONFIG_PCIEAER: y
  # DG2 HuC authentication needs both MEI transports, even without full PXP.
  # This fixes the demonstrated initialization defect, not the PCIe access loss.
  CONFIG_INTEL_MEI_GSC: y
  CONFIG_INTEL_MEI_PXP: y

# Protect service state
nest::reset_filter_rules:
  - 'P /etc/cni/**'
  - 'P /etc/letsencrypt/**'
  - 'P /etc/libvirt/**'
  - '- /etc/libvirt/qemu/networks/default.xml'
  - '- /etc/xdg/color.jcnf'
  - 'P /etc/xdg/color/**'
  - 'P /etc/xdg/DisplayCAL/**'
  - 'P /var/lib/cni/**'
  - 'P /var/lib/libvirt/**'
  - 'P /var/lib/samba/**'

nest::service::gitlab_runner::host: 'gitlab.joyfullee.me'
nest::service::gitlab_runner::instances:
  runner:
    bolt: true
    podman: true
    puppetcore: true
    qemu: true

  builder:
    limit: 2
    bolt: true
    podman: true
    puppetcore: true
    qemu: true

  ghc:
    bolt: true
    podman: true
    qemu: true

  r10k:
    # Retain the existing runner identity/tag, but deploy only to OpenVox.
    default_image: 'registry.gitlab.joyfullee.me/nest/tools/bolt'
    bolt: true
    puppetcore: true
    volumes:
      - '/nest/home/kubeconfigs/eyrie.conf:/root/.kube/config:ro'
      - '/etc/puppetlabs/bolt/deploy-key.pem:/root/.ssh/id_rsa:ro'
      - '/etc/ssh/ssh_known_hosts:/etc/ssh/ssh_known_hosts:ro'

nest::service::reverse_proxy::hosts:
  gitlab.joyfullee.me:
    destination: 'gitlab.eyrie'
    ip: '172.22.4.2'
    encoded_slashes: true
    proxy_ssl: true
    timeout: 600
    websockets: true

  registry.gitlab.joyfullee.me:
    destination: 'registry.gitlab.eyrie'
    ip: '172.22.4.2'
    proxy_ssl: true
    timeout: 3600

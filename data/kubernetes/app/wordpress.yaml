---
include:
  - 'nest::service::wordpress'
  - 'nest::service::mysql'

service_name: "%{nest::kubernetes::service}"
cert_issuer: eyrie-ca
cert_issuer_kind: cluster-issuer
ingress_class: contour
storage_class: ceph-filesystem
db_storage_class: ceph-block

resources:
  registry_auths: {}

values:
  image:
    # Multi-architecture WordPress 7.0.2 manifest published 2026-07-30.
    digest: 'sha256:4a70606af740f23f5cd8ac86b13e66adffca022526953c68de1307418a1186a8'
  wordpressPassword: 'wordpress' # throwaway
  allowEmptyPassword: false
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: "%{lookup('ingress_class')}"
    hostname: "%{nest::kubernetes::fqdn}"
    annotations:
      "cert-manager.io/%{lookup('cert_issuer_kind')}": "%{lookup('cert_issuer')}"
      projectcontour.io/response-timeout: infinity
    tls: true
  resources:
    requests:
      memory: '200Mi'
  podSecurityContext:
    fsGroup: 1000
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
  persistence:
    storageClass: "%{lookup('storage_class')}"
    accessModes:
      - ReadWriteMany
  # Increase check intervals for slow workers
  livenessProbe:
    initialDelaySeconds: 600
    periodSeconds: 60
  readinessProbe:
    periodSeconds: 60
  mariadb:
    image:
      # Multi-architecture MariaDB 12.3.2 manifest already proven in production.
      digest: 'sha256:a1b946eaefe2da489f518daf6b00493b873b4593f3fe650658725a0a799f5e7b'
    auth:
      database: "%{nest::kubernetes::service}"
      username: "%{nest::kubernetes::service}"
      password: "%{nest::service::wordpress::database_password}"
      rootPassword: "%{nest::service::mysql::root_password}"
    primary:
      persistence:
        storageClass: "%{lookup('db_storage_class')}"
      # Increase check intervals for slow workers
      livenessProbe:
        initialDelaySeconds: 300
        periodSeconds: 30
        timeoutSeconds: 5
      readinessProbe:
        periodSeconds: 30
        timeoutSeconds: 5
  networkPolicy:
    extraIngress:
      - ports:
        - port: 22

patches:
  10-nest:
    - patch:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: "%{nest::kubernetes::service}-wordpress"
          namespace: "%{nest::kubernetes::namespace}"
          labels:
            'joyfullee.me/nest': 'stage1'
    - patch:
        apiVersion: v1
        kind: Service
        metadata:
          name: "%{nest::kubernetes::service}-wordpress"
          namespace: "%{nest::kubernetes::namespace}"
          labels:
            'joyfullee.me/nest': 'stage1'

  30-nest:
    patch:
      - op: add
        path: '/spec/template/spec/containers/1/volumeMounts/-'
        value: &wordpress_data
          name: wordpress-data
          mountPath: '/srv/wordpress'
    target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: 'joyfullee.me/nest'

  30-nest-init:
    patch:
      - op: add
        path: '/spec/template/spec/initContainers/1/volumeMounts/-'
        value: *wordpress_data
    target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: 'joyfullee.me/nest'

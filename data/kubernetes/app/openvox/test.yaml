---
restore_suspended: true

# Host-local CSI volumes cannot mount in two pods during a surge.
# Keep one writer when the chart updates the single TEST Puppet server.
patches:
  12-single-writer-puppetserver:
    patch:
      - op: replace
        path: /spec/strategy
        value:
          type: Recreate
    target:
      group: apps
      version: v1
      kind: Deployment
      name: "%{nest::kubernetes::service}-puppetserver"

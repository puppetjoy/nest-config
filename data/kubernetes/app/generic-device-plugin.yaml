---
resources:
  registry_auths: {}
  backup: {}
  restore: {}

values:
  config:
    data: |
      devices:
        - name: gpu
          groups:
            - count: 3
              paths:
                - path: /dev/dri/renderD128
                - path: /dev/kfd
        # A separate, single render-only allocation; no AMD /dev/kfd dependency.
        # PCI-qualified discovery must not advertise Owl's AMD GPU as Intel Arc.
        - name: intel-arc
          groups:
            - paths:
                - path: /dev/dri/by-path/pci-0000:05:00.0-render
                  mountPath: /dev/dri/renderD128
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: 'node-role.kubernetes.io/compute'
              operator: Exists
          - matchExpressions:
            - key: 'node-role.kubernetes.io/workstation'
              operator: Exists
  tolerations:
    - key: 'node-role.kubernetes.io/compute'
      operator: 'Exists'
      effect: 'NoSchedule'
    - key: 'node-role.kubernetes.io/workstation'
      operator: 'Exists'
      effect: 'NoSchedule'

---
# Production resource defaults; the service-scoped joyride overlay selects the
# owner-authorized launch image, replicas, billing and protection configuration.
# TEST remains in its separate namespace and credential scope.
include:
- nest::service::joyride
service_name: joyride
fqdn: joyride.eyrie
runtime_environment: production
ingress_class: contour
# Same immutable artifact exercised on TEST; never a mutable production tag.
joyride_image: registry.gitlab.joyfullee.me/joy/joyride/app@sha256:2c3c39e8a955692ead7a70eac4aedae9c8e4d702309e8f77ea56d0ca075f3021
affinity: {}
tolerations: []
resources:
  # The inherited generic protection Jobs are not application-aware recipes.
  backup:
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: joyride-backup
      namespace: joyride
    spec:
      # Remains inactive until production activation and protection acceptance.
      suspend: true
      schedule: '37 */3 * * *'
      timeZone: UTC
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 2
      failedJobsHistoryLimit: 2
      startingDeadlineSeconds: 600
      jobTemplate:
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: 3600
          template:
            metadata:
              labels:
                app: joyride-backup
            spec:
              automountServiceAccountToken: false
              restartPolicy: Never
              securityContext:
                fsGroup: 10001
              imagePullSecrets:
              - name: joyride-backup-pull
              - name: joyride-pull
              initContainers:
              - name: admit-backup
                image: '%{lookup(''joyride_operations_image'')}'
                command:
                - python
                - -I
                - -B
                - -c
                - |
                  import hashlib, os
                  data = open('/app/platform_runtime/backup.py', 'rb').read()
                  if hashlib.sha256(data).hexdigest() != '0bd5c397f068b7e9eed784ce48afcd0abf4eeb4ae3b5a11c53aaa04939415f5c':
                      raise SystemExit('Operational source hash mismatch')
                  fd = os.open('/trusted/backup.py', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o444)
                  with os.fdopen(fd, 'wb') as stream:
                      stream.write(data)
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 10001
                  runAsGroup: 10001
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
                volumeMounts:
                - name: scripts
                  mountPath: /trusted
              containers:
              - name: backup
                # Administrative capture must not use Luna's application image.
                image: '%{lookup(''config_image'')}'
                imagePullPolicy: Always
                command: [python3, -B, /trusted/backup.py, --stage-root, /scratch, --environment, production]
                env:
                - name: KUBECONFIG
                  value: /kubeconfig/eyrie.conf
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                    ephemeral-storage: 2Gi
                  limits:
                    memory: 512Mi
                    ephemeral-storage: 24Gi
                volumeMounts:
                - name: scripts
                  mountPath: /trusted
                  readOnly: true
                - name: scratch
                  mountPath: /scratch
                - name: backup
                  mountPath: /nest/backup/joyride
                - name: kubeconfig
                  mountPath: /kubeconfig/eyrie.conf
                  readOnly: true
              volumes:
              - name: scripts
                emptyDir:
                  sizeLimit: 1Mi
              - name: scratch
                emptyDir:
                  sizeLimit: 24Gi
              - name: backup
                hostPath:
                  path: /nest/backup/joyride
                  type: DirectoryOrCreate
              - name: kubeconfig
                hostPath:
                  path: /nest/home/kubeconfigs/eyrie.conf
                  type: File
  restore: {}
  runtime_secret:
    apiVersion: v1
    kind: Secret
    metadata:
      name: joyride-runtime
      namespace: joyride
    type: Opaque
    data:
      DJANGO_SECRET_KEY: '%{nest::service::joyride::production_django_secret_key_base64}'
  ops_auth_secret:
    apiVersion: v1
    kind: Secret
    metadata:
      name: joyride-ops-auth
      namespace: joyride
    type: Opaque
    data:
      OPS_TOKEN: '%{nest::service::joyride::production_ops_token_base64}'
  upstream_secret:
    apiVersion: v1
    kind: Secret
    metadata:
      name: joyride-upstream
      namespace: joyride
    type: Opaque
    data:
      WMATA_API_KEY: '%{nest::service::joyride::production_wmata_api_key_base64}'
  smtp_secret:
    apiVersion: v1
    kind: Secret
    metadata:
      name: joyride-smtp
      namespace: joyride
    type: Opaque
    data:
      EMAIL_HOST_PASSWORD: '%{nest::service::joyride::production_smtp_password_base64}'
  stripe_secret:
    apiVersion: v1
    kind: Secret
    metadata:
      name: joyride-stripe
      namespace: joyride
    type: Opaque
    data:
      STRIPE_SECRET_KEY: '%{nest::service::joyride::production_stripe_secret_key_base64}'
      STRIPE_WEBHOOK_SECRET: '%{nest::service::joyride::production_stripe_webhook_secret_base64}'
  pull:
    apiVersion: v1
    kind: Secret
    metadata:
      name: joyride-pull
      namespace: joyride
    type: kubernetes.io/dockerconfigjson
    data:
      .dockerconfigjson: '%{nest::service::joyride::production_registry_dockerconfig_base64}'
  nest_registry_auths: {}
  storage:
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: joyride-data
      namespace: joyride
    spec:
      accessModes: [ReadWriteMany]
      storageClassName: ceph-filesystem
      resources:
        requests:
          storage: 8Gi
  database:
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    metadata:
      name: joyride-cnpg
      namespace: joyride
    spec:
      instances: 1
      imageName: ghcr.io/cloudnative-pg/postgresql:17.11
      storage:
        storageClass: ceph-block
        size: 8Gi
      bootstrap:
        initdb:
          database: joyride
          owner: joyride
      monitoring:
        enablePodMonitor: true
  config:
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: joyride-config
      namespace: joyride
    data:
      RUNTIME_ENV: production
      ALLOWED_HOSTS: joyride.eyrie
      PUBLIC_ORIGIN: https://joyridedc.com
      MAIL_ENABLED: '0'
      # Prepared identity only. SMTP credentials and activation remain separate.
      EMAIL_HOST: smtp.gmail.com
      EMAIL_HOST_USER: joy@joyridedc.com
      DEFAULT_FROM_EMAIL: Friday Night Joyride <hello@joyridedc.com>
      STRIPE_MODE: disabled
      OPS_SCOPES: status,diagnostics,member:read
      PRIVATE_ROOT: /data/private
      PUBLIC_ROOT: /data/public
      MAP_ROOT: /data/maps
      TMPDIR: /data/tmp

  app:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: joyride
      namespace: joyride
    spec:
      # No candidate frontend/content is published by this preparation.
      replicas: 0
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: joyride
      template:
        metadata:
          labels:
            app: joyride
        spec:
          automountServiceAccountToken: false
          securityContext: &pod_security
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
          - name: joyride-pull
          containers:
          - name: web
            image: '%{lookup(''joyride_image'')}'
            command: [gunicorn, 'joyride.wsgi:application', --bind, '0.0.0.0:8000', --workers, '2']
            securityContext: &container_security
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 10001
              runAsGroup: 10001
              capabilities:
                drop: [ALL]
            envFrom: &environment
            - configMapRef:
                name: joyride-config
            env: &runtime
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: joyride-runtime
                  key: DJANGO_SECRET_KEY
            # Future approved production provisioning must populate only this
            # Secret from production_smtp_password, never the shared runtime map.
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: joyride-smtp
                  key: EMAIL_HOST_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: joyride-cnpg-app
                  key: uri
            ports:
            - name: web
              containerPort: 8000
            resources: &application_resources
              requests:
                cpu: 100m
                memory: 192Mi
              limits:
                memory: 768Mi
            readinessProbe:
              httpGet: &readiness
                path: /health/ready
                port: 8000
                httpHeaders:
                - name: Host
                  value: joyride.eyrie
              initialDelaySeconds: 10
              periodSeconds: 15
            livenessProbe:
              httpGet:
                <<: *readiness
                path: /health/live
              initialDelaySeconds: 10
              periodSeconds: 15
            volumeMounts: &read_mounts
            - name: data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /data/tmp
          # Serial initialization belongs to the application pod, never Bolt.
          # Zero replicas and the TEST-only compile guard prevent execution.
          initContainers:
          - name: migrate
            image: '%{lookup(''joyride_image'')}'
            command: [python, manage.py, migrate, --noinput]
            securityContext: *container_security
            envFrom: *environment
            env: *runtime
            resources: *application_resources
            volumeMounts:
            - name: tmp
              mountPath: /data/tmp
          - name: basemap
            image: '%{lookup(''joyride_image'')}'
            command: [python, /app/platform_runtime/bootstrap.py]
            securityContext: *container_security
            envFrom: *environment
            env: *runtime
            resources: *application_resources
            volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /data/tmp
            - name: pull
              mountPath: /pull
              readOnly: true
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: joyride-data
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
          - name: pull
            secret:
              secretName: joyride-pull
  worker:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: joyride-worker
      namespace: joyride
    spec:
      replicas: 0
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: joyride-worker
      template:
        metadata:
          labels:
            app: joyride-worker
        spec:
          automountServiceAccountToken: false
          securityContext: *pod_security
          imagePullSecrets:
          - name: joyride-pull
          containers:
          - name: worker
            image: '%{lookup(''joyride_image'')}'
            command: [python, manage.py, worker]
            securityContext: *container_security
            envFrom: *environment
            env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: joyride-runtime
                  key: DJANGO_SECRET_KEY
            # Future approved production provisioning must populate only this
            # Secret from production_smtp_password, never the shared runtime map.
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: joyride-smtp
                  key: EMAIL_HOST_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: joyride-cnpg-app
                  key: uri
            - name: WMATA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: joyride-upstream
                  key: WMATA_API_KEY
            resources: *application_resources
            volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /data/tmp
          volumes: &runtime_volumes
          - name: data
            persistentVolumeClaim:
              claimName: joyride-data
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
  ops_app:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: joyride-ops
      namespace: joyride
    spec:
      replicas: 0
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: joyride-ops
      template:
        metadata:
          labels:
            app: joyride-ops
          annotations:
            checksum/ops-config: '%{nest::service::joyride::production_ops_config_sha256}'
        spec:
          automountServiceAccountToken: false
          nodeSelector:
            node-role.kubernetes.io/worker: ''
          securityContext: *pod_security
          imagePullSecrets:
          - name: joyride-pull
          containers:
          - name: ops
            image: '%{lookup(''joyride_image'')}'
            command: [gunicorn, 'joyride.ops_wsgi:application', --bind, '127.0.0.1:8001', --workers, '2']
            securityContext: *container_security
            envFrom: *environment
            env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: joyride-runtime
                  key: DJANGO_SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: joyride-cnpg-app
                  key: uri
            - name: OPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: joyride-ops-auth
                  key: OPS_TOKEN
            resources: *application_resources
            readinessProbe:
              exec:
                command: [python, -c, 'import socket; socket.create_connection(("127.0.0.1", 8001), timeout=2).close()']
            volumeMounts: *read_mounts
          - name: tls-ops
            image: docker.io/nginxinc/nginx-unprivileged@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
            command: [nginx, -g, 'daemon off;']
            securityContext: *container_security
            ports:
            - name: tls-ops
              containerPort: 8443
            readinessProbe:
              tcpSocket:
                port: 8443
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                memory: 128Mi
            volumeMounts:
            - name: ops-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: ops-tls
              mountPath: /tls
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: joyride-data
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
          - name: ops-config
            configMap:
              name: joyride-ops-config
          - name: ops-tls
            secret:
              secretName: joyride-ops-tls
          - name: nginx-tmp
            emptyDir:
              medium: Memory
              sizeLimit: 64Mi
  web:
    apiVersion: v1
    kind: Service
    metadata:
      name: joyride-web
      namespace: joyride
    spec:
      selector:
        app: joyride
      ports:
      - name: http
        port: 8000
        targetPort: 8000
  ops:
    apiVersion: v1
    kind: Service
    metadata:
      name: joyride-ops
      namespace: joyride
    spec:
      type: LoadBalancer
      # Reserved candidate only; no Service or route is created during preparation.
      loadBalancerIP: 172.21.0.2
      allocateLoadBalancerNodePorts: false
      externalTrafficPolicy: Local
      loadBalancerSourceRanges: [172.22.0.0/24]
      selector:
        app: joyride-ops
      ports:
      - name: https
        port: 443
        targetPort: 8443
  ops_config:
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: joyride-ops-config
      namespace: joyride
    binaryData:
      nginx.conf: '%{nest::service::joyride::production_ops_config_base64}'
  ops_certificate:
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: joyride-ops-tls
      namespace: joyride
    spec:
      secretName: joyride-ops-tls
      issuerRef:
        name: eyrie-ca
        kind: ClusterIssuer
      dnsNames: [joyride-ops.eyrie]
  certificate:
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: joyride-tls
      namespace: joyride
    spec:
      secretName: joyride-tls
      issuerRef:
        name: eyrie-ca
        kind: ClusterIssuer
      dnsNames: [joyride.eyrie]
  ingress:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: joyride
      namespace: joyride
    spec:
      ingressClassName: contour
      tls:
      - hosts: [joyride.eyrie]
        secretName: joyride-tls
      rules:
      - host: joyride.eyrie
        http:
          paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: joyride-web
                port:
                  number: 8000
  web_policy:
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: joyride-web
      namespace: joyride
    spec:
      podSelector:
        matchLabels:
          app: joyride
      policyTypes: [Ingress]
      ingress:
      - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: projectcontour
          podSelector:
            matchLabels:
              app.kubernetes.io/component: envoy
        ports:
        - protocol: TCP
          port: 8000
  ops_policy:
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: joyride-ops
      namespace: joyride
    spec:
      podSelector:
        matchLabels:
          app: joyride-ops
      policyTypes: [Ingress]
      # Dedicated VPN source-preserving TLS only; never shared public ingress.
      # The authenticated port 8001 is bound only to same-pod loopback.
      ingress:
      - from:
        - ipBlock:
            cidr: 172.22.0.0/24
        ports:
        - protocol: TCP
          port: 8443
  worker_policy:
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: joyride-worker
      namespace: joyride
    spec:
      podSelector:
        matchLabels:
          app: joyride-worker
      policyTypes: [Ingress]
      ingress: []

  monitor:
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: joyride-monitor
      namespace: joyride
    spec:
      # Source preparation only, including after a future render/apply.
      suspend: true
      schedule: '*/2 * * * *'
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 2
      startingDeadlineSeconds: 60
      jobTemplate:
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: 90
          template:
            metadata:
              labels:
                app: joyride-monitor
            spec:
              automountServiceAccountToken: false
              restartPolicy: Never
              securityContext: *pod_security
              imagePullSecrets:
              - name: joyride-pull
              containers:
              - name: monitor
                image: '%{lookup(''joyride_operations_image'')}'
                command: [python, -B, /app/platform_runtime/monitor.py, --environment, production]
                securityContext: *container_security
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    memory: 64Mi
  monitor_policy:
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: joyride-monitor-web
      namespace: joyride
    spec:
      podSelector:
        matchLabels:
          app: joyride
      policyTypes: [Ingress]
      ingress:
      - from:
        - podSelector:
            matchLabels:
              app: joyride-monitor
        ports:
        - protocol: TCP
          port: 8000
  alert_rules:
    apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: joyride
      namespace: joyride
      labels:
        release: kube-prometheus-stack
    spec:
      groups:
      - name: joyride
        rules:
        - alert: JoyrideApplicationProbeStale
          # Suspended preparation is not a missing production success.
          expr: (kube_cronjob_spec_suspend{namespace="joyride",cronjob="joyride-monitor"} == 0) unless on(namespace,cronjob) (time() - kube_cronjob_status_last_successful_time{namespace="joyride",cronjob="joyride-monitor"} <= 360)
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Joyride application probes have no recent success
            description: Check the private production monitor Job. Readiness, session shell, basemap and homepage must pass; never print member data or credentials.
        - alert: JoyrideBackupStale
          expr: (kube_cronjob_spec_suspend{namespace="joyride",cronjob="joyride-backup"} == 0) unless on(namespace,cronjob) (time() - kube_cronjob_status_last_successful_time{namespace="joyride",cronjob="joyride-backup"} <= 14400)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Joyride has no verified recent backup generation
            description: Inspect the private backup Job and completion receipt before restore. Never publish private archives or use an archive without matching completion metadata.

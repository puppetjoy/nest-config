# Falcon-local media workloads; storage is managed by the media-storage release.
---
service_name: media
resources:
  backup: {}
  scheduled-backup:
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: media-backup
      namespace: "%{nest::kubernetes::namespace}"
    spec:
      schedule: 31 5 * * *
      timeZone: America/New_York
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 2
      jobTemplate:
        spec:
          activeDeadlineSeconds: 7200
          ttlSecondsAfterFinished: 21600
          template:
            spec:
              nodeSelector:
                kubernetes.io/hostname: falcon
              tolerations:
              - key: node-role.kubernetes.io/workstation
                operator: Exists
                effect: NoSchedule
              automountServiceAccountToken: false
              restartPolicy: Never
              containers:
              - name: backup
                image: "%{lookup('config_image')}"
                command:
                - bolt
                - plan
                - run
                - nest::eyrie::media::backup
                env:
                - name: KUBECONFIG
                  value: "/kubeconfig"
                volumeMounts:
                - name: kubeconfig
                  mountPath: "/kubeconfig"
                  readOnly: true
                - name: ssh-key
                  mountPath: "/root/.ssh/id_ed25519"
                  readOnly: true
                - name: bolt-config
                  mountPath: "/etc/puppetlabs/bolt"
                  readOnly: true
                - name: eyaml
                  mountPath: "/etc/eyaml"
                  readOnly: true
              imagePullSecrets:
              - name: media-registry-auths
              volumes:
              - name: kubeconfig
                hostPath:
                  path: "/nest/home/kubeconfigs/eyrie.conf"
                  type: File
              - name: ssh-key
                hostPath:
                  path: "/root/.ssh/id_ed25519_eyrie"
                  type: File
              - name: bolt-config
                hostPath:
                  path: "/etc/puppetlabs/bolt"
                  type: Directory
              - name: eyaml
                hostPath:
                  path: "/etc/eyaml"
                  type: Directory
  restore: {}
  registry_auths: {}
  nzbget-deployment:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: nzbget
      namespace: "%{nest::kubernetes::namespace}"
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app.kubernetes.io/name: nzbget
          app.kubernetes.io/part-of: media
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nzbget
            app.kubernetes.io/part-of: media
        spec:
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: falcon
          tolerations:
          - key: node-role.kubernetes.io/workstation
            operator: Exists
            effect: NoSchedule
          securityContext:
            supplementalGroups:
            - 1000
            - 1001
          terminationGracePeriodSeconds: 120
          initContainers:
          - name: storage-readiness
            image: registry.eyrie/nest/stage1/server:latest
            command:
            - "/bin/sh"
            - "-ec"
            - |-
              set -eu
              test -s /config/nzbget.conf
              test -w /config
              test "$(findmnt -n -o FSTYPE -T /downloads)" = zfs
              test -w /downloads
              mountpoint -q /downloads/nzb
              test "$(findmnt -n -o SOURCE -T /downloads/nzb | cut -d '[' -f1)" = nest/crypt/downloads
              test -r /downloads/nzb
              test -w /downloads/nzb
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: config
              mountPath: "/config"
            - name: trust
              mountPath: "/etc/ssl/certs/ca-certificates.crt"
              readOnly: true
            - name: downloads
              mountPath: "/downloads"
            - name: nzb
              mountPath: "/downloads/nzb"
              readOnly: false
          containers:
          - name: nzbget
            image: docker.io/linuxserver/nzbget@sha256:1ecf2cbb7ca98d2893682e01d6c30bd4f912c5e217e329e2fdd73af20a0b67dd
            imagePullPolicy: IfNotPresent
            env:
            - name: PUID
              value: '1001'
            - name: PGID
              value: '1001'
            - name: TZ
              value: America/New_York
            ports:
            - name: http
              containerPort: 6789
            volumeMounts:
            - name: config
              mountPath: "/config"
            - name: trust
              mountPath: "/etc/ssl/certs/ca-certificates.crt"
              readOnly: true
            - name: downloads
              mountPath: "/downloads"
            - name: nzb
              mountPath: "/downloads/nzb"
              readOnly: false
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
            startupProbe:
              tcpSocket:
                port: http
              periodSeconds: 5
              failureThreshold: 120
            readinessProbe:
              tcpSocket:
                port: http
              periodSeconds: 10
            securityContext:
              privileged: false
          volumes:
          - name: config
            persistentVolumeClaim:
              claimName: nzbget-config
          - name: trust
            hostPath:
              path: "/etc/ssl/certs/ca-certificates.crt"
              type: File
          - name: downloads
            persistentVolumeClaim:
              claimName: downloads
          - name: nzb
            hostPath:
              path: "/nest/downloads/nzbget/watch"
              type: Directory
  nzbget-service:
    apiVersion: v1
    kind: Service
    metadata:
      name: nzbget
      namespace: "%{nest::kubernetes::namespace}"
    spec:
      selector:
        app.kubernetes.io/name: nzbget
        app.kubernetes.io/part-of: media
      ports:
      - name: http
        port: 6789
        targetPort: http
  nzbget-ingress:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: nzbget
      namespace: "%{nest::kubernetes::namespace}"
      annotations:
        cert-manager.io/cluster-issuer: eyrie-ca
        ingress.kubernetes.io/force-ssl-redirect: 'true'
        projectcontour.io/websocket-routes: "/"
        projectcontour.io/response-timeout: infinity
    spec:
      ingressClassName: contour-workstation
      tls:
      - hosts:
        - nzbget.eyrie
        secretName: nzbget-certs
      rules:
      - host: nzbget.eyrie
        http:
          paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: nzbget
                port:
                  name: http

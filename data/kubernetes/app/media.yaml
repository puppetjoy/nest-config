  plex-deployment:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: plex
      namespace: "%{nest::kubernetes::namespace}"
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app.kubernetes.io/name: plex
          app.kubernetes.io/part-of: media
      template:
        metadata:
          labels:
            app.kubernetes.io/name: plex
            app.kubernetes.io/part-of: media
        spec:
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: falcon
          tolerations:
          - key: node-role.kubernetes.io/workstation
            operator: Exists
            effect: NoSchedule
          securityContext:
            supplementalGroups:
            - 1000
            - 1001
          terminationGracePeriodSeconds: 120
          initContainers:
          - name: storage-readiness
            image: registry.eyrie/nest/stage1/server:latest
            command:
            - "/bin/sh"
            - "-ec"
            - |-
              set -eu
              test -s '/config/Library/Application Support/Plex Media Server/Preferences.xml'
              test -w /config
              mountpoint -q /movies
              test "$(findmnt -n -o SOURCE -T /movies | cut -d '[' -f1)" = nest/crypt/movies
              test -r /movies
              mountpoint -q /tv
              test "$(findmnt -n -o SOURCE -T /tv | cut -d '[' -f1)" = nest/crypt/tv
              test -r /tv
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: config
              mountPath: "/config"
            - name: trust
              mountPath: "/etc/ssl/certs/ca-certificates.crt"
              readOnly: true
            - name: movies
              mountPath: "/movies"
              readOnly: true
            - name: tv
              mountPath: "/tv"
              readOnly: true
          - name: transcode-permissions
            image: docker.io/plexinc/pms-docker@sha256:01bdf0ad6d53198da4331540c1e73ab65db7a72e961fff97ecb0847d46055c5f
            command:
            - "/bin/sh"
            - "-ec"
            - chown 1001:1001 /transcode; chmod 0770 /transcode
            volumeMounts:
            - name: transcode
              mountPath: "/transcode"
            securityContext:
              runAsUser: 0
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
                add:
                - CHOWN
                - FOWNER
          containers:
          - name: plex
            image: docker.io/plexinc/pms-docker@sha256:01bdf0ad6d53198da4331540c1e73ab65db7a72e961fff97ecb0847d46055c5f
            imagePullPolicy: IfNotPresent
            env:
            - name: PLEX_UID
              value: '1001'
            - name: PLEX_GID
              value: '1001'
            - name: TZ
              value: America/New_York
            - name: ADVERTISE_IP
              value: https://plex.eyrie:443/,http://172.22.4.2:32400/
            ports:
            - name: http
              containerPort: 32400
            volumeMounts:
            - name: config
              mountPath: "/config"
            - name: trust
              mountPath: "/etc/ssl/certs/ca-certificates.crt"
              readOnly: true
            - name: movies
              mountPath: "/movies"
              readOnly: true
            - name: tv
              mountPath: "/tv"
              readOnly: true
            - name: transcode
              mountPath: "/transcode"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 12Gi
                squat.ai/intel-arc: '1'
            startupProbe:
              tcpSocket:
                port: http
              periodSeconds: 5
              failureThreshold: 120
            readinessProbe:
              tcpSocket:
                port: http
              periodSeconds: 10
            securityContext:
              privileged: false
          volumes:
          - name: config
            persistentVolumeClaim:
              claimName: plex-config
          - name: trust
            hostPath:
              path: "/etc/ssl/certs/ca-certificates.crt"
              type: File
          - name: movies
            hostPath:
              path: "/nest/movies"
              type: Directory
          - name: tv
            hostPath:
              path: "/nest/tv"
              type: Directory
          - name: transcode
            emptyDir:
              medium: Memory
              sizeLimit: 8Gi
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
  plex-service:
    apiVersion: v1
    kind: Service
    metadata:
      name: plex
      namespace: "%{nest::kubernetes::namespace}"
    spec:
      selector:
        app.kubernetes.io/name: plex
        app.kubernetes.io/part-of: media
      ports:

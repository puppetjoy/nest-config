---
service_name: "grafana-%{nest::kubernetes::namespace}"

values:
  # Scrape existing cluster services
  grafana:
    enabled: true
  kubeStateMetrics:
    enabled: true
  coreDns:
    enabled: true
    service:
      enabled: false
  kubeApiServer:
    enabled: true
  kubeControllerManager:
    # The static pods expose metrics only on loopback, so the chart's
    # node-IP ServiceMonitor can never reach them.
    enabled: false
    service:
      enabled: false
  kubeEtcd:
    enabled: false
    service:
      enabled: false
  kubeProxy:
    # Eyrie does not run kube-proxy.
    enabled: false
    service:
      enabled: false
  kubeScheduler:
    # The static pods expose metrics only on loopback, so the chart's
    # node-IP ServiceMonitor can never reach them.
    enabled: false
    service:
      enabled: false
  kubelet:
    enabled: true
    service:
      enabled: false
  prometheusOperator:
    kubeletService:
      enabled: false

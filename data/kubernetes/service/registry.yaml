---
# A full backup and test restore normally consume almost the entire three-hour
# cycle. Give them separate 95- and 85-minute windows; the host lock in the
# plans refuses overlap if either sync runs unusually long.
backup_schedule: '0 2-23/3 * * *'
restore_schedule: '35 3-23/3 * * *'
restore_job_active_deadline_seconds: 9900

# activeDeadlineSeconds is a wall-clock bound, not an inactivity detector.  A
# full registry sync can legitimately exceed two hours, but this 2h45m bound
# normally expires 15 minutes before the three-hour schedule.  Deadline
# enforcement is asynchronous, so concurrencyPolicy: Forbid can still skip a
# generation during controller/API disruption; post-deploy freshness remains a
# separate gate.
backup_job_active_deadline_seconds: 9900

# Ensure 'test' jobs use prod images
registry: 'registry.eyrie'

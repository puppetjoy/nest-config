# Production service resources; TEST has independent service and namespace scope
# Private proxy budget covers 16 buffered 192 MiB uploads plus process overhead
joyride_image: registry.gitlab.joyfullee.me/joy/joyride/app@sha256:a5034a3a875af292b44c3383ce116cd089f6b08f4d6dc8ab2d0601d83ff2e8ea
joyride_operations_image: registry.gitlab.joyfullee.me/joy/joyride/app@sha256:de6190b0f3c81c1133a0f25ac9119d2f3e8124788b4e9e14c579bf452312f263
resources:
  config:
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: joyride-config
      namespace: joyride
    data:
      RUNTIME_ENV: production
      ALLOWED_HOSTS: joyride.eyrie
      PUBLIC_ORIGIN: https://joyridedc.com
      MAIL_ENABLED: '1'
      EMAIL_HOST: smtp.gmail.com
      EMAIL_HOST_USER: joy@joyridedc.com
      DEFAULT_FROM_EMAIL: Friday Night Joyride <hello@joyridedc.com>
      STRIPE_MODE: live
      OPS_SCOPES: status,diagnostics,member:read
      PRIVATE_ROOT: /data/private
      PUBLIC_ROOT: /data/public
      MAP_ROOT: /data/maps
      TMPDIR: /data/tmp
      STRIPE_PRICE_ID: price_1USr46RreaX3Pn1aj9WYMMj4
      STRIPE_TAX_RATE_ID: txr_1Ua0ZgRreaX3Pn1aVV1r9tS2
      OWNER_EMAIL: joy@joyfullee.me
      RELEASE_ROOT: /data/private/releases
  app:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: joyride
      namespace: joyride
    spec:
      replicas: 1
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      minReadySeconds: 10
      selector:
        matchLabels:
          app: joyride
      template:
        metadata:
          labels:
            app: joyride
            joyride.nest/application: joyride
        spec:
          automountServiceAccountToken: false
          securityContext: &id006
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
            fsGroupChangePolicy: OnRootMismatch
          imagePullSecrets:
          - name: joyride-pull
          containers:
          - name: web
            image: '%{lookup(''joyride_image'')}'
            command:
            - gunicorn
            - joyride.wsgi:application
            - --bind
            - 0.0.0.0:8000
            - --workers
            - '2'
            - --timeout
            - '60'
            - --graceful-timeout
            - '125'
            securityContext: &id002
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 10001
              runAsGroup: 10001
              capabilities:
                drop:
                - ALL
            envFrom: &id003
            - configMapRef:
                name: joyride-config
            env: &id004
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: joyride-runtime
                  key: DJANGO_SECRET_KEY
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: joyride-smtp
                  key: EMAIL_HOST_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: joyride-cnpg-app
                  key: uri
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: joyride-stripe
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: joyride-stripe
                  key: STRIPE_WEBHOOK_SECRET
            ports:
            - name: web
              containerPort: 8000
            resources: &id005
              requests:
                cpu: 100m
                memory: 192Mi
              limits:
                memory: 768Mi
            readinessProbe:
              httpGet:
                path: /health/ready
                port: 8000
                httpHeaders: &id001
                - name: Host
                  value: joyride.eyrie
              initialDelaySeconds: 10
              periodSeconds: 15
            livenessProbe:
              httpGet:
                path: /health/live
                port: 8000
                httpHeaders: *id001
              initialDelaySeconds: 10
              periodSeconds: 15
            volumeMounts: &id007
            - name: data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /data/tmp
          initContainers:
          - name: migrate
            image: '%{lookup(''joyride_image'')}'
            command:
            - python
            - manage.py
            - migrate
            - --noinput
            securityContext: *id002
            envFrom: *id003
            env: *id004
            resources: *id005
            volumeMounts:
            - name: tmp
              mountPath: /data/tmp
          - name: provision-owner
            image: '%{lookup(''joyride_image'')}'
            command:
            - python
            - manage.py
            - provision_owner
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 10001
              runAsGroup: 10001
              capabilities:
                drop:
                - ALL
            envFrom:
            - configMapRef:
                name: joyride-config
            env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: joyride-runtime
                  key: DJANGO_SECRET_KEY
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: joyride-smtp
                  key: EMAIL_HOST_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: joyride-cnpg-app
                  key: uri
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: joyride-stripe
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: joyride-stripe
                  key: STRIPE_WEBHOOK_SECRET
            resources:
              requests:
                cpu: 100m
                memory: 192Mi
              limits:
                memory: 768Mi
            volumeMounts:
            - name: tmp
              mountPath: /data/tmp
          - name: basemap
            image: '%{lookup(''joyride_image'')}'
            command:
            - python
            - /app/platform_runtime/bootstrap.py
            securityContext: *id002
            envFrom: *id003
            env: *id004
            resources: *id005
            volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /data/tmp
            - name: pull
              mountPath: /pull
              readOnly: true
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: joyride-data
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
          - name: pull
            secret:
              secretName: joyride-pull
      progressDeadlineSeconds: 1800
  worker:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: joyride-worker
      namespace: joyride
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: joyride-worker
      template:
        metadata:
          labels:
            app: joyride-worker
            joyride.nest/application: joyride
        spec:
          automountServiceAccountToken: false
          securityContext: *id006
          imagePullSecrets:
          - name: joyride-pull
          containers:
          - name: worker
            image: '%{lookup(''joyride_image'')}'
            command:
            - python
            - manage.py
            - worker
            securityContext: *id002
            envFrom: *id003
            env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: joyride-runtime
                  key: DJANGO_SECRET_KEY
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: joyride-smtp
                  key: EMAIL_HOST_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: joyride-cnpg-app
                  key: uri
            - name: WMATA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: joyride-upstream
                  key: WMATA_API_KEY
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: joyride-stripe
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: joyride-stripe
                  key: STRIPE_WEBHOOK_SECRET
            resources: *id005
            volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /data/tmp
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: joyride-data
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
      progressDeadlineSeconds: 1800
  ops_app:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: joyride-ops
      namespace: joyride
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: joyride-ops
      template:
        metadata:
          labels:
            app: joyride-ops
            joyride.nest/application: joyride
          annotations:
            checksum/ops-config: '%{nest::service::joyride::production_ops_config_sha256}'
        spec:
          automountServiceAccountToken: false
          nodeSelector:
            node-role.kubernetes.io/worker: ''
          securityContext: *id006
          imagePullSecrets:
          - name: joyride-pull
          containers:
          - name: ops
            image: '%{lookup(''joyride_image'')}'
            command:
            - gunicorn
            - joyride.ops_wsgi:application
            - --bind
            - 127.0.0.1:8001
            - --workers
            - '2'
            - --timeout
            - '60'
            - --graceful-timeout
            - '125'
            securityContext: *id002
            envFrom: *id003
            env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: joyride-runtime
                  key: DJANGO_SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: joyride-cnpg-app
                  key: uri
            - name: OPS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: joyride-ops-auth
                  key: OPS_TOKEN
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: joyride-stripe
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: joyride-stripe
                  key: STRIPE_WEBHOOK_SECRET
            resources: *id005
            readinessProbe:
              exec:
                command:
                - python
                - -c
                - import socket; socket.create_connection(("127.0.0.1", 8001), timeout=2).close()
            volumeMounts: *id007
          - name: tls-ops
            image: docker.io/nginxinc/nginx-unprivileged@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
            command:
            - nginx
            - -g
            - daemon off;
            securityContext: *id002
            ports:
            - name: tls-ops
              containerPort: 8443
            readinessProbe:
              tcpSocket:
                port: 8443
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                memory: 128Mi
            volumeMounts:
            - name: ops-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: ops-tls
              mountPath: /tls
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: joyride-data
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
          - name: ops-config
            configMap:
              name: joyride-ops-config
          - name: ops-tls
            secret:
              secretName: joyride-ops-tls
          - name: nginx-tmp
            emptyDir:
              medium: Memory
              sizeLimit: 64Mi
      progressDeadlineSeconds: 1800
  backup:
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: joyride-backup
      namespace: joyride
    spec:
      suspend: false
      schedule: 37 */3 * * *
      timeZone: UTC
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 2
      failedJobsHistoryLimit: 2
      startingDeadlineSeconds: 600
      jobTemplate:
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: 3600
          template:
            metadata:
              labels:
                app: joyride-backup
            spec:
              automountServiceAccountToken: false
              restartPolicy: Never
              securityContext:
                fsGroup: 10001
              imagePullSecrets:
              - name: joyride-backup-pull
              - name: joyride-pull
              initContainers:
              - name: admit-backup
                image: '%{lookup(''joyride_operations_image'')}'
                command:
                - python
                - -I
                - -B
                - -c
                - "import hashlib, os\ndata = open('/app/platform_runtime/backup.py',\
                  \ 'rb').read()\nif hashlib.sha256(data).hexdigest() != '352f5de3ca10ccb1f61c1ffaaec887d491c6a6347a234a0ebdc5195ae30d95b3':\n\
                  \    raise SystemExit('Operational source hash mismatch')\nfd =\
                  \ os.open('/trusted/backup.py', os.O_WRONLY | os.O_CREAT | os.O_EXCL,\
                  \ 0o444)\nwith os.fdopen(fd, 'wb') as stream:\n    stream.write(data)\n"
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 10001
                  runAsGroup: 10001
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                    - ALL
                volumeMounts:
                - name: scripts
                  mountPath: /trusted
              containers:
              - name: backup
                image: '%{lookup(''config_image'')}'
                imagePullPolicy: Always
                command:
                - python3
                - -B
                - /trusted/backup.py
                - --stage-root
                - /scratch
                - --environment
                - production
                env:
                - name: KUBECONFIG
                  value: /kubeconfig/eyrie.conf
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                    - ALL
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                    ephemeral-storage: 2Gi
                  limits:
                    memory: 512Mi
                    ephemeral-storage: 24Gi
                volumeMounts:
                - name: scripts
                  mountPath: /trusted
                  readOnly: true
                - name: scratch
                  mountPath: /scratch
                - name: backup
                  mountPath: /nest/backup/joyride
                - name: kubeconfig
                  mountPath: /kubeconfig/eyrie.conf
                  readOnly: true
              volumes:
              - name: scripts
                emptyDir:
                  sizeLimit: 1Mi
              - name: scratch
                emptyDir:
                  sizeLimit: 24Gi
              - name: backup
                hostPath:
                  path: /nest/backup/joyride
                  type: DirectoryOrCreate
              - name: kubeconfig
                hostPath:
                  path: /nest/home/kubeconfigs/eyrie.conf
                  type: File
  backup_registry_auths:
    apiVersion: v1
    kind: Secret
    metadata:
      name: joyride-backup-pull
      namespace: joyride
    type: kubernetes.io/dockerconfigjson
    data:
      .dockerconfigjson: '%{nest::kubernetes::registry_auths_base64}'
  monitor:
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: joyride-monitor
      namespace: joyride
    spec:
      suspend: false
      schedule: '*/2 * * * *'
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 2
      startingDeadlineSeconds: 60
      jobTemplate:
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: 90
          template:
            metadata:
              labels:
                app: joyride-monitor
            spec:
              automountServiceAccountToken: false
              restartPolicy: Never
              securityContext: *id006
              imagePullSecrets:
              - name: joyride-pull
              containers:
              - name: monitor
                image: '%{lookup(''joyride_operations_image'')}'
                command:
                - python
                - -B
                - /app/platform_runtime/monitor.py
                - --environment
                - production
                securityContext: *id002
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    memory: 64Mi
  storage:
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: joyride-data
      namespace: joyride
    spec:
      accessModes:
      - ReadWriteMany
      storageClassName: ceph-filesystem
      resources:
        requests:
          storage: 10Gi
  production_access_config:
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: joyride-production-access
      namespace: joyride
    binaryData:
      nginx.conf: '%{nest::service::joyride::production_access_config_base64}'
  production_access:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: joyride-production-access
      namespace: joyride
    spec:
      replicas: 1
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      selector:
        matchLabels:
          app: joyride-production-access
      template:
        metadata:
          labels:
            app: joyride-production-access
            app.kubernetes.io/component: private-access
          annotations:
            checksum/production-access-config: '%{nest::service::joyride::production_access_config_sha256}'
        spec:
          automountServiceAccountToken: false
          nodeSelector:
            node-role.kubernetes.io/worker: ''
          securityContext:
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: nginx
            image: docker.io/nginxinc/nginx-unprivileged@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
            command:
            - nginx
            - -g
            - daemon off;
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 10001
              runAsGroup: 10001
              capabilities:
                drop:
                - ALL
            ports:
            - name: https
              containerPort: 8443
            readinessProbe:
              tcpSocket:
                port: 8443
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
                ephemeral-storage: 64Mi
              limits:
                memory: 4096Mi
                ephemeral-storage: 5Gi
            volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: config
            configMap:
              name: joyride-production-access
          - name: tls
            secret:
              secretName: joyride-tls
          - name: tmp
            emptyDir:
              sizeLimit: 4Gi
  production_access_service:
    apiVersion: v1
    kind: Service
    metadata:
      name: joyride-production-access
      namespace: joyride
    spec:
      type: LoadBalancer
      loadBalancerIP: 172.21.0.3
      allocateLoadBalancerNodePorts: false
      externalTrafficPolicy: Local
      loadBalancerSourceRanges:
      - 172.22.4.3/32
      selector:
        app: joyride-production-access
      ports:
      - name: https
        port: 443
        targetPort: 8443
  production_access_policy:
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: joyride-production-access
      namespace: joyride
    spec:
      podSelector:
        matchLabels:
          app: joyride-production-access
      policyTypes:
      - Ingress
      - Egress
      ingress:
      - from:
        - ipBlock:
            cidr: 172.22.4.3/32
        ports:
        - protocol: TCP
          port: 8443
      egress:
      - to:
        - podSelector:
            matchLabels:
              app: joyride-trusted-production
        ports:
        - protocol: TCP
          port: 8004
      - to:
        - podSelector:
            matchLabels:
              app: joyride-internal-web
        ports:
        - protocol: TCP
          port: 8003
      - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  production_operations_scripts:
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: joyride-production-operations-scripts
      namespace: joyride
    binaryData:
      install_routing_graph.py: '%{nest::service::joyride::production_routing_installer_base64}'
  trusted_production_app:
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: joyride-trusted-production
      namespace: joyride
    spec:
      replicas: 1
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      minReadySeconds: 10
      progressDeadlineSeconds: 1800
      selector:
        matchLabels:
          app: joyride-trusted-production
      template:
        metadata:
          labels:
            app: joyride-trusted-production
            joyride.nest/application: joyride
            app.kubernetes.io/component: trusted-production
          annotations:
            checksum/routing-installer: '%{nest::service::joyride::production_routing_installer_sha256}'
        spec:
          automountServiceAccountToken: false
          nodeSelector:
            node-role.kubernetes.io/compute: ''
          tolerations:
          - key: node-role.kubernetes.io/compute
            operator: Exists
            effect: NoSchedule
          terminationGracePeriodSeconds: 150
          securityContext:
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
          - name: joyride-pull
          initContainers:
          - name: routing-graph
            image: '%{lookup(''joyride_image'')}'
            command:
            - python
            - -B
            - /platform/install_routing_graph.py
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 10001
              runAsGroup: 10001
              capabilities:
                drop:
                - ALL
            env:
            - name: RUNTIME_ENV
              value: production
            - name: JOYRIDE_PRODUCTION_ROUTING_BOOTSTRAP
              value: '1'
            resources:
              requests:
                cpu: 250m
                memory: 64Mi
              limits:
                memory: 1536Mi
            volumeMounts:
            - name: data
              mountPath: /data/private
              subPath: private
            - name: scripts
              mountPath: /platform
              readOnly: true
            - name: pull
              mountPath: /pull
              readOnly: true
          containers:
          - name: trusted-production
            image: '%{lookup(''joyride_image'')}'
            command:
            - gunicorn
            - joyride.trusted_production_wsgi:application
            - --bind
            - 0.0.0.0:8004
            - --workers
            - '2'
            - --threads
            - '3'
            - --timeout
            - '120'
            - --graceful-timeout
            - '125'
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 10001
              runAsGroup: 10001
              capabilities:
                drop:
                - ALL
            envFrom:
            - configMapRef:
                name: joyride-config
            env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: joyride-runtime
                  key: DJANGO_SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: joyride-cnpg-app
                  key: uri
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: joyride-stripe
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: joyride-stripe
                  key: STRIPE_WEBHOOK_SECRET
            ports:
            - name: trusted
              containerPort: 8004
            resources:
              requests:
                cpu: 100m
                memory: 192Mi
              limits:
                memory: 2048Mi
            startupProbe:
              tcpSocket:
                port: 8004
              periodSeconds: 2
              failureThreshold: 60
            readinessProbe:
              tcpSocket:
                port: 8004
              periodSeconds: 15
            lifecycle:
              preStop:
                exec:
                  command:
                  - python
                  - -c
                  - import time; time.sleep(15)
            volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: data
              mountPath: /data/private
              subPath: private

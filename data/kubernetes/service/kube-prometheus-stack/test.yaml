values:
  # Let test instance manage CRD upgrades
  crds:
    upgradeJob:
      enabled: true
      forceConflicts: true

  # Production owns the cluster-wide scrape definitions and rules. Both
  # Prometheus instances discover ServiceMonitors and PrometheusRules across
  # namespaces, so rendering a second set here duplicates every cluster target
  # and alert series.
  defaultRules:
    create: false
  coreDns:
    enabled: false
  kubeApiServer:
    enabled: false
  kubelet:
    enabled: false

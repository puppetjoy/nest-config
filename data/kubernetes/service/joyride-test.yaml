---
# TEST-only operational protection; no production backup or restore is enabled.
# Independently admitted backup producer with direct read-only PVC file capture
# Joyride 89d332fc559472751a3eab3a627858137785b019, main pipeline 13343/build 58913.
# Keep serving and shared production operational pins unchanged.
joyride_operations_image: registry.gitlab.joyfullee.me/joy/joyride/app@sha256:84ee376636921e0125bb3da608a21a0da9771d053109478c07d1290a5a67ed7b
resources:
  backup_registry_auths:
    apiVersion: v1
    kind: Secret
    metadata:
      name: joyride-test-backup-pull
      namespace: test
    type: kubernetes.io/dockerconfigjson
    data:
      .dockerconfigjson: '%{nest::kubernetes::registry_auths_base64}'
  backup:
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: joyride-test-backup
      namespace: test
    spec:
      suspend: false
      schedule: '17 */3 * * *'
      timeZone: UTC
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 2
      failedJobsHistoryLimit: 2
      startingDeadlineSeconds: 600
      jobTemplate:
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: 3600
          template:
            metadata:
              labels:
                app: joyride-test-backup
            spec:
              automountServiceAccountToken: false
              restartPolicy: Never
              securityContext:
                fsGroup: 10001
                fsGroupChangePolicy: OnRootMismatch
              imagePullSecrets:
              - name: joyride-test-backup-pull
              - name: joyride-test-pull
              initContainers:
              - name: admit-backup
                image: '%{lookup(''joyride_operations_image'')}'
                command:
                - python
                - -I
                - -B
                - -c
                - |
                  import hashlib, os
                  data = open('/app/platform_runtime/backup.py', 'rb').read()
                  if hashlib.sha256(data).hexdigest() != 'b7016a68f34f305d17937c3e2fdff5df0f1a19d1c3da30c9943e91c354514c80':
                      raise SystemExit('Operational source hash mismatch')
                  fd = os.open('/trusted/backup.py', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o444)
                  with os.fdopen(fd, 'wb') as stream:
                      stream.write(data)
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 10001
                  runAsGroup: 10001
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
                volumeMounts:
                - name: scripts
                  mountPath: /trusted
              containers:
              - name: backup
                # Trusted Nest operational image, not a frontend release.
                image: '%{lookup(''config_image'')}'
                imagePullPolicy: Always
                command: [python3, -B, /trusted/backup.py, --stage-root, /scratch, --file-source, local-readonly, --format, objects-v2]
                env:
                - name: KUBECONFIG
                  value: /kubeconfig/eyrie.conf
                securityContext:
                  runAsUser: 0
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    # Read owner-only application files on the verified read-only PVC
                    add: [DAC_OVERRIDE]
                    drop: [ALL]
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                    ephemeral-storage: 2Gi
                  limits:
                    memory: 512Mi
                    ephemeral-storage: 24Gi
                volumeMounts:
                - name: scripts
                  mountPath: /trusted
                  readOnly: true
                - name: scratch
                  mountPath: /scratch
                - name: backup
                  mountPath: /nest/backup/joyride-test
                - name: source
                  mountPath: /data
                  readOnly: true
                - name: kubeconfig
                  mountPath: /kubeconfig/eyrie.conf
                  readOnly: true
              volumes:
              - name: scripts
                emptyDir:
                  sizeLimit: 1Mi
              - name: scratch
                emptyDir:
                  sizeLimit: 24Gi
              - name: source
                persistentVolumeClaim:
                  claimName: joyride-test-data
                  readOnly: true
              - name: backup
                hostPath:
                  path: /nest/backup/joyride-test
                  type: DirectoryOrCreate
              - name: kubeconfig
                hostPath:
                  path: /nest/home/kubeconfigs/eyrie.conf
                  type: File
  monitor:
    apiVersion: batch/v1
    kind: CronJob
    metadata:
      name: joyride-test-monitor
      namespace: test
    spec:
      suspend: false
      schedule: '*/2 * * * *'
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 2
      startingDeadlineSeconds: 60
      jobTemplate:
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: 90
          template:
            metadata:
              labels:
                app: joyride-test-monitor
            spec:
              automountServiceAccountToken: false
              restartPolicy: Never
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                seccompProfile:
                  type: RuntimeDefault
              imagePullSecrets:
              - name: joyride-test-pull
              containers:
              - name: monitor
                image: '%{lookup(''joyride_operations_image'')}'
                command: [python, -B, /app/platform_runtime/monitor.py]
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    memory: 64Mi
  alert_rules:
    apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: joyride-test
      namespace: test
      labels:
        release: kube-prometheus-stack
    spec:
      groups:
      - name: joyride-test
        rules:
        - alert: JoyrideTestApplicationProbeStale
          expr: time() - kube_cronjob_status_last_successful_time{namespace="test",cronjob="joyride-test-monitor"} > 360 or absent(kube_cronjob_status_last_successful_time{namespace="test",cronjob="joyride-test-monitor"})
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Joyride TEST application probes have no recent success
            description: Check the private TEST monitor Job. Readiness, session, basemap and homepage must all pass; never print member data or credentials.
        - alert: JoyrideTestBackupStale
          expr: time() - kube_cronjob_status_last_successful_time{namespace="test",cronjob="joyride-test-backup"} > 14400 or absent(kube_cronjob_status_last_successful_time{namespace="test",cronjob="joyride-test-backup"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Joyride TEST has no verified recent backup generation
            description: Inspect the backup Job and completion receipt before attempting a restore. Never use an archive without matching completion metadata.

---
node_role: storage
# Prometheus TSDB requires local block semantics and must not depend on the
# NFS server it is intended to monitor.
storage_class: data-crypt

resources:
  certs: {}

values:
  prometheus:
    prometheusSpec:
      serviceMonitorSelector:
        matchLabels:
          team: rook # read ServiceMonitors created by rook-ceph-operator
      serviceMonitorNamespaceSelector:
        matchLabels:
          name: "%{nest::kubernetes::namespace}" # only in the deployed namespace

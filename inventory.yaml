---
config:
  podman:
    interpreters:
      rb: ['/usr/bin/ruby', '-r', 'puppet', '-e', 'Puppet[:tags] = File.open("/.apply_tags", &:gets) if File.exist? "/.apply_tags"; load ARGV.shift']
  ssh:
    interpreters:
      rb: ['/usr/bin/ruby', '-r', 'puppet']

features:
  - puppet-agent

groups:
  - name: 'gentoo'
    config:
      ssh:
        # Nest hosts authenticate normal SSH transport as the unprivileged
        # nest::user account, then Bolt escalates per plan/task with _run_as.
        # Keep key selection with OpenSSH/ssh-agent/default identity handling:
        # Agent Request workers may have only the user ssh-agent socket mounted,
        # while in-cluster Bolt callers may still have /root/.ssh/id_ed25519.
        user: 'joy'
    groups:
    - name: 'servers'
      targets:
        - _plugin: puppetdb
          query: "inventory[certname] { facts.osfamily = 'Gentoo' and facts.profile.variant = 'server' and certname != 'builder' }"
          target_mapping:
            name: certname
            uri: facts.fqdn
    - name: 'workstations'
      targets:
        - _plugin: puppetdb
          query: "inventory[certname] { facts.osfamily = 'Gentoo' and facts.profile.variant = 'workstation' and certname != 'builder' }"
          target_mapping:
            name: certname
            uri: facts.fqdn
    - name: 'mobile'
      targets:
        - _plugin: puppetdb
          query: "inventory[certname] { facts.osfamily = 'Gentoo' and facts.profile.variant = 'mobile' and certname != 'builder' }"
          target_mapping:
            name: certname
            uri: facts.fqdn

  - name: 'macs'
    config:
      ssh:
        interpreters:
          # Apple's system Ruby cannot load the native Puppet agent libraries.
          rb: ['/opt/puppetlabs/puppet/bin/ruby', '-r', 'puppet']
    targets:
      - _plugin: puppetdb
        query: "inventory[certname] { facts.osfamily = 'Darwin' }"
        target_mapping:
          name: certname
          uri: facts.fqdn

  - name: 'windows'
    config:
      ssh:
        # Cygwin authenticates the Windows administrator account; SYSTEM owns
        # the SSH service but is not the remote login identity.
        user: 'joy'
    targets:
      - _plugin: puppetdb
        query: "inventory[certname] { facts.osfamily = 'windows' }"
        target_mapping:
          name: certname
          uri: facts.fqdn

  - name: 'eyrie'
    groups:
      - name: 'eyrie-control-plane'
        targets:
          - _plugin: puppetdb
            query: "inventory[certname] { certname ~ '^control\\d+' }"
            target_mapping:
              name: certname
              uri: facts.fqdn
      - name: 'eyrie-workers'
        targets:
          - _plugin: puppetdb
            query: "inventory[certname] { (certname = 'eagle' or certname = 'kite') }"
            target_mapping:
              name: certname
              uri: facts.fqdn
      - name: 'eyrie-storage'
        targets:
          - _plugin: puppetdb
            query: "inventory[certname] { certname ~ '^storage\\d+' }"
            target_mapping:
              name: certname
              uri: facts.fqdn
      - name: 'eyrie-workstations'
        targets:
          - _plugin: puppetdb
            query: "nodes { inventory { facts.profile.variant = 'workstation' and certname != 'eagle' and certname != 'kite' } and resources { type = 'Class' and title = 'Nest::Service::Kubernetes' } }"
            target_mapping:
              name: certname
              uri: facts.fqdn
      - name: 'eyrie-compute'
        targets:
          - _plugin: puppetdb
            query: "nodes { resources { type = 'Class' and title = 'Nest::Tool::Rocm' } and resources { type = 'Class' and title = 'Nest::Service::Kubernetes' } }"
            target_mapping:
              name: certname
              uri: facts.fqdn

  - name: 'kubernetes'
    targets:
      - _plugin: task
        task: nest::get_kubernetes_services

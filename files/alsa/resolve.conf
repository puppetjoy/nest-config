# Resolve-specific ALSA routing for Osprey.
</usr/share/alsa/alsa.conf>
</usr/share/alsa/alsa.conf.d/50-pipewire.conf>
</usr/share/alsa/alsa.conf.d/99-pipewire-default.conf>

# Fairlight probes the literal dmix PCM during startup. Keep that probe inside
# PipeWire rather than resolving the nonexistent card 0/device 0 on Osprey's
# NVIDIA HDMI controller.
pcm.!dmix {
  type pipewire
  playback_node "-1"
}

# Dedicated private TEST endpoint; never forward to a shared ingress listener.
pid /tmp/nginx.pid;
worker_processes 2;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 15s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;
  limit_conn_zone $binary_remote_addr zone=private_clients:1m;
  limit_req_zone $binary_remote_addr zone=private_requests:1m rate=10r/s;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_tickets off;
  ssl_certificate /tls/tls.crt;
  ssl_certificate_key /tls/tls.key;

  upstream joyride_web { server joyride-test-internal-web.test.svc.cluster.local:8003; }
  upstream joyride_ops { server joyride-test-trusted-test.test.svc.cluster.local:8002; }
  map $request_uri $routing_method {
    default denied;
    "~^/routing/status$" GET;
    "~^/routing/(?:propose|match|settle|export)$" POST;
    "~^/routing/reviews(?:/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?$" review;
  }
  map "$routing_method:$request_method" $routing_method_allowed {
    default 0;
    "GET:GET" 1;
    "POST:POST" 1;
    "review:GET" 1;
    "review:POST" 1;
  }
  # Raw routing targets must never escape to the ordinary web listener.
  map "$request_uri:$uri" $routing_target {
    default 0;
    "~^/+routing(?:/|%|[?]|:|$)" 1;
    "~:/routing(?:/|$)" 1;
  }
  map "$routing_target:$routing_method" $routing_denied {
    default 0;
    "1:denied" 1;
  }
  # Match the original target, never nginx's decoded/normalized location URI.
  # Email octets may encode printable ASCII, excluding %, /, backslash, ? and #.
  # No generic query forwarding: only single-valued audit cursor pairs survive.
  map $request_uri $member_method {
    default denied;
    "~^/ops/members/(?:[A-Za-z0-9._~!$&'()*+,;=:@-]|%(?:2[1246789aAbBcCdDeE]|3[0-9aAbBcCdDeE]|4[0-9A-Fa-f]|5[0-9aAbBdDeEfF]|6[0-9A-Fa-f]|7[0-9aAbBcCdDeE]))+$" GET;
    "~^/ops/members/(?:[A-Za-z0-9._~!$&'()*+,;=:@-]|%(?:2[1246789aAbBcCdDeE]|3[0-9aAbBcCdDeE]|4[0-9A-Fa-f]|5[0-9aAbBdDeEfF]|6[0-9A-Fa-f]|7[0-9aAbBcCdDeE]))+/audit(?:[?](?:before=[A-Fa-f0-9-]+(?:&history_before=[0-9]+)?|history_before=[0-9]+(?:&before=[A-Fa-f0-9-]+)?))?$" GET;
    "~^/ops/members/(?:[A-Za-z0-9._~!$&'()*+,;=:@-]|%(?:2[1246789aAbBcCdDeE]|3[0-9aAbBcCdDeE]|4[0-9A-Fa-f]|5[0-9aAbBdDeEfF]|6[0-9A-Fa-f]|7[0-9aAbBcCdDeE]))+/(?:waiver/reset|waiver/record|subscription/cancel|membership/set|sessions/revoke)$" POST;
  }

  # A raw ops traversal must not fall through to the ordinary web upstream.
  map $request_uri $raw_ops {
    default 0;
    "~^/+ops(?:/|%|[?]|$)" 1;
  }
  map "$raw_ops:$uri" $ops_escape {
    default 0;
    "~^1:/(?!ops(?:/|$))" 1;
  }

  server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
    return 421;
  }
  server {
    listen 8443 ssl;
    server_name joyride-test.eyrie;
    # Reject a valid SNI with another Host, and a valid Host with another SNI.
    if ($ssl_server_name != joyride-test.eyrie) { return 421; }
    if ($http_host !~* "^joyride-test\.eyrie(:443)?$") { return 421; }

    if ($ops_escape = 1) { return 404; }
    if ($routing_denied = 1) { return 404; }
    limit_conn private_clients 16;

    proxy_http_version 1.1;
    proxy_set_header Host joyride-test.eyrie;
    proxy_set_header Connection "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Tailscale-User-Login "";
    proxy_set_header Tailscale-User-Name "";
    proxy_set_header X-Joyride-Trusted-Test "";

    # Compare raw targets before accepting nginx-normalized ops locations.
    location = /ops/status {
      limit_req zone=private_requests burst=20 nodelay;
      if ($request_uri != /ops/status) { return 404; }
      if ($request_method != GET) { return 405; }
      proxy_pass_request_headers off;
      proxy_set_header Host joyride-test.eyrie;
      proxy_set_header Connection "";
      proxy_pass http://joyride_ops;
    }
    location = /ops/diagnostics {
      limit_req zone=private_requests burst=20 nodelay;
      if ($request_uri != /ops/diagnostics) { return 404; }
      if ($request_method != GET) { return 405; }
      proxy_pass_request_headers off;
      proxy_set_header Host joyride-test.eyrie;
      proxy_set_header Connection "";
      proxy_pass http://joyride_ops;
    }
    location = /ops/deploy {
      limit_req zone=private_requests burst=20 nodelay;
      if ($request_uri != /ops/deploy) { return 404; }
      if ($request_method != POST) { return 405; }
      client_max_body_size 4k;
      proxy_pass_request_headers off;
      proxy_set_header Host joyride-test.eyrie;
      proxy_set_header Content-Type application/json;
      proxy_set_header Connection "";
      proxy_pass http://joyride_ops;
    }
    location = /ops/releases {
      limit_req zone=private_requests burst=20 nodelay;
      if ($request_uri != /ops/releases) { return 404; }
      if ($request_method != GET) { return 405; }
      proxy_pass_request_headers off;
      proxy_set_header Host joyride-test.eyrie;
      proxy_set_header Connection "";
      proxy_pass http://joyride_ops;
    }
    location = /ops/releases/frontend {
      if ($request_uri != /ops/releases/frontend) { return 404; }
      if ($request_method != POST) { return 405; }
      client_max_body_size 32m;
      client_body_timeout 120s;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_pass_request_headers off;
      proxy_set_header Host joyride-test.eyrie;
      proxy_set_header Connection "";
      proxy_set_header Content-Type $http_content_type;
      proxy_set_header X-Release-Sha256 $http_x_release_sha256;
      proxy_set_header X-Previous-Sha256 $http_x_previous_sha256;
      proxy_set_header X-Release-Version $http_x_release_version;
      proxy_set_header X-Source-Head $http_x_source_head;
      proxy_pass http://joyride_ops;
    }
    location = /ops/releases/content {
      if ($request_uri != /ops/releases/content) { return 404; }
      if ($request_method != POST) { return 405; }
      client_max_body_size 64m;
      client_body_timeout 120s;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_pass_request_headers off;
      proxy_set_header Host joyride-test.eyrie;
      proxy_set_header Connection "";
      proxy_set_header Content-Type $http_content_type;
      proxy_set_header X-Release-Sha256 $http_x_release_sha256;
      proxy_set_header X-Previous-Sha256 $http_x_previous_sha256;
      proxy_set_header X-Release-Version $http_x_release_version;
      proxy_set_header X-Source-Head $http_x_source_head;
      proxy_pass http://joyride_ops;
    }
    # Authority comes only from the admitted backchannel, not caller headers.
    location /ops/members/ {
      if ($member_method = denied) { return 404; }
      if ($request_method != $member_method) { return 405; }
      limit_req zone=private_requests burst=20 nodelay;
      client_max_body_size 8k;
      proxy_pass_request_headers off;
      proxy_set_header Host joyride-test.eyrie;
      proxy_set_header Connection "";
      proxy_set_header Content-Type $http_content_type;
      proxy_set_header Idempotency-Key $http_idempotency_key;
      proxy_pass http://joyride_ops;
    }
    location /ops { return 404; }
    location /delivery { return 404; }

    location /routing/ {
      if ($routing_method = denied) { return 404; }
      if ($routing_method_allowed = 0) { return 405; }
      limit_req zone=private_requests burst=20 nodelay;
      client_max_body_size 1m;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_pass_request_headers off;
      proxy_set_header Host joyride-test.eyrie;
      proxy_set_header Connection "";
      proxy_set_header Content-Type $http_content_type;
      proxy_pass http://joyride_ops;
    }

    location / { proxy_pass http://joyride_web; }
  }
  # Kubelet-only readiness listener; it has no LoadBalancer or Service port.
  server {
    listen 8080;
    location = /health/live { return 200 "ready\n"; }
    location / { return 404; }
  }
}

---
description: 'Deploy dev Flight Deck Agent Request console'

parameters:
  deploy:
    description: 'Run or skip the deployment'
    type: Boolean
    default: true

  source_revision:
    description: 'Expected full lowercase SHA; must match the source-managed service pin'
    type: "Variant[Pattern[/\\A[0-9a-f]{40}\\z/], Enum['']]"
    default: ''

  init:
    description: 'Deploy initial revision'
    type: Boolean
    default: false

  render_to:
    description: 'Just render the template'
    type: String
    default: ''

steps:
  - description: 'Deploy dev Flight Deck'
    plan: nest::eyrie::ai::deploy_flight_deck
    parameters:
      service: 'flight-deck-dev'
      source_revision: $source_revision
      namespace: 'ai'
      deploy: $deploy
      init: $init
      render_to: $render_to

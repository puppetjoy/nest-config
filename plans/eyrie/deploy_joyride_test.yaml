---
description: 'Deploy isolated private Joyride TEST; never production'
parameters:
  render_to:
    type: String
    default: ''
steps:
  - plan: nest::kubernetes::deploy
    parameters:
      service: joyride-test
      app: joyride
      namespace: test
      init: false
      # KubeCM uses Helm --wait --timeout 1h, longer than TEST's 1800s progress
      # deadline. Keep its shared transport/wait policy and fail-closed readiness.
      wait: true
      render_to: $render_to

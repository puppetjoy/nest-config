---
description: 'Deploy test monitoring'

parameters:
  deploy:
    description: 'Run or skip the deployment'
    type: Boolean
    default: true

steps:
  - description: 'Wake and verify infrastructure test dependencies'
    plan: nest::eyrie::test::infrastructure
    parameters:
      action: start
      enabled: $deploy and $render_to == ''

  - description: 'Deploy test kube-prometheus stack'
    plan: 'nest::kubernetes::deploy'
    parameters:
      service: 'kube-prometheus-stack'
      app: 'kube-prometheus-stack'
      chart: 'prometheus-community/kube-prometheus-stack'
      namespace: 'test'
      repo_url: 'https://prometheus-community.github.io/helm-charts'
      version: '87.21.0'
      deploy: $deploy

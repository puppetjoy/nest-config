---
default:
  interruptible: true

include:
  - local: '.gitlab/ci/release-dag-fixture.yml'
  - local: '.gitlab/ci/release-routing.yml'
  - local: '.gitlab/ci/release-graph.yml'
  - local: '.gitlab/ci/executor-bootstrap.yml'

stages:
  - 'Test'
  - 'Build'
  - 'Deploy'

.all-branch-ci:
  rules:
    - if: '$NEST_DAG_FIXTURE =~ /[\s\S]/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Explicitly requested only; exercises job/helper fetch and artifact upload
# without invoking a build, deployment, registration change or host mutation.
'Runner smoke':
  stage: 'Test'
  image: 'registry.eyrie/nest/stage1/server'
  tags: ['$RUNNER_SMOKE_TAG']
  rules:
    - if: '$NEST_DAG_FIXTURE =~ /[\s\S]/'
      when: never
    - if: '$RUNNER_SMOKE_TAG'
  script:
    - 'test "$CI_RUNNER_VERSION" = "19.5.1"'
    - 'uname -m'
    - 'git rev-parse --verify HEAD'
    - 'printf "%s %s\n" "$CI_RUNNER_ID" "$CI_RUNNER_VERSION" > runner-smoke.txt'
  artifacts:
    paths: ['runner-smoke.txt']
    expire_in: 1 week

'Validate':
  extends: .all-branch-ci
  image: '${CI_REGISTRY}/nest/tools/pdk'
  stage: 'Test'
  script:
    - 'pdk validate'

'Unit Test':
  extends: .all-branch-ci
  image: '${CI_REGISTRY}/nest/tools/pdk'
  stage: 'Test'
  script:
    - 'pdk test unit --parallel'
    - 'pdk test unit --tests=spec/files/apiserver_etcd_endpoints_spec.rb,spec/files/validate_etcd_cluster_spec.rb,spec/files/api_survivor_observation_spec.rb,spec/files/maintenance_storage_spec.rb'


.template:
  stage: 'Build'
  script:
    - 'BOLT_BASE=$(python3 scripts/nest-executor-bootstrap.py --ci-base)'
    - 'mkdir empty'
    - 'mkdir -p executor-receipts'
    - 'EXECUTOR_IMAGE="${CI_REGISTRY_IMAGE}/${CI_COMMIT_REF_SLUG}:executor-${CI_PIPELINE_ID}-${CI_JOB_ID}-${CPU}"'
    - 'podman login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" <<< $CI_REGISTRY_PASSWORD'
    - 'podman pull "$BOLT_BASE"'
    - 'BOLT_BASE_DIGEST=$(podman image inspect "$BOLT_BASE" --format "{{ index .RepoDigests 0 }}")'
    - 'if [ "$EXECUTOR_BOOTSTRAP" = "true" ]; then test "$BOLT_BASE_DIGEST" = "$BOLT_BASE"; fi'
    - 'podman build
        --build-arg=BOLT_IMAGE="$BOLT_BASE_DIGEST"
        --build-arg=BRANCH="$CI_COMMIT_BRANCH"
        --build-arg=REPOSITORY="$CI_REPOSITORY_URL"
        --build-arg=SOURCE_URL="${CI_PROJECT_URL}.git"
        --build-arg=SOURCE_SHA="$CI_COMMIT_SHA"
        --dns=172.22.4.3
        --file=Containerfile
        --secret=id=ssh_private_key,src="$NEST_CI_PRIVATE_KEY_FILE"
        --squash
        --tag="$EXECUTOR_IMAGE"
        empty'
    - 'bash files/build/publish-image.sh "$EXECUTOR_IMAGE" > "executor-receipts/${CPU}.ref"'
    - 'python3 bin/ci-executor-receipt record "executor-receipts/${CPU}.ref" "executor-receipts/${CPU}.json"'
    - 'python3 scripts/nest-compiler-candidate.py record "executor-receipts/${CPU}.json" "executor-receipts/${CPU}.compiler.json"'
    - 'if [ "$EXECUTOR_BOOTSTRAP" != "true" ]; then podman tag "$EXECUTOR_IMAGE" "${CI_REGISTRY_IMAGE}/${CI_COMMIT_REF_SLUG}:${CPU}" && podman push "${CI_REGISTRY_IMAGE}/${CI_COMMIT_REF_SLUG}:${CPU}"; fi'
  artifacts:
    paths: ['executor-receipts/', 'executor-bootstrap/']
  rules:
    - if: '$NEST_DAG_FIXTURE =~ /[\s\S]/'
      when: never
    - if: '$RELEASE_GRAPH =~ /[\s\S]/ || $RELEASE_GRAPH_FILE =~ /[\s\S]/ || $RELEASE_GRAPH_NODE =~ /[\s\S]/ || $RELEASE_GRAPH_MEMBER =~ /[\s\S]/ || $RELEASE_GRAPH_INPUT_PIPELINE =~ /[\s\S]/ || $RELEASE_GRAPH_INPUT_JOB =~ /[\s\S]/ || $RELEASE_GRAPH_INPUT_SHA256 =~ /[\s\S]/ || $RELEASE_GRAPH_ROOT_PIPELINE =~ /[\s\S]/'
      when: never
    - if: '$RELEASE_INPUTS'
      when: never
    - if: '$RELEASE_ROUTE =~ /[\s\S]/ || $RELEASE_ROUTE_MEMBER =~ /[\s\S]/ || $RELEASE_ROUTE_EXECUTOR_PIPELINE =~ /[\s\S]/ || $RELEASE_ROUTE_EXECUTOR_JOB =~ /[\s\S]/ || $RELEASE_ROUTE_PLACEMENT =~ /[\s\S]/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_TAG == null && $EXECUTOR_BOOTSTRAP == "true" && $RELEASE_BOOTSTRAP_PIPELINE && $RELEASE_BOOTSTRAP_JOB && $RELEASE_BOOTSTRAP_SHA256 && $RELEASE_BOOTSTRAP_FILE == null && $EXECUTOR_ONLY == "true" && $BUILD == $CPU'
    - if: '($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger") && $CI_COMMIT_TAG == null && $EXECUTOR_BOOTSTRAP == "true" && $RELEASE_BOOTSTRAP_FILE && $RELEASE_BOOTSTRAP_PIPELINE == null && $RELEASE_BOOTSTRAP_JOB == null && $RELEASE_BOOTSTRAP_SHA256 == null && $EXECUTOR_ONLY == "true" && $BUILD == $CPU'
    - if: '$EXECUTOR_BOOTSTRAP =~ /[\s\S]/ || $RELEASE_BOOTSTRAP_FILE =~ /[\s\S]/ || $RELEASE_BOOTSTRAP_PIPELINE =~ /[\s\S]/ || $RELEASE_BOOTSTRAP_JOB =~ /[\s\S]/ || $RELEASE_BOOTSTRAP_SHA256 =~ /[\s\S]/'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $BUILD == $CPU'
    - if: '$EXECUTOR_ONLY == "true" && $BUILD == $CPU'
    - if: '$EXECUTOR_ONLY == "true" && $BUILD'
      when: never
    - if: '$EXECUTOR_ONLY == "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $BUILD'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

'Build haswell':
  extends: .template
  tags: ['amd64']
  variables:
    CPU: 'haswell'

'Build cortex-a53':
  extends: .template
  tags: ['arm64']
  variables:
    CPU: 'cortex-a53'

'Build sifive-u74':
  extends: .template
  tags: ['riscv64']
  variables:
    CPU: 'sifive-u74'

'Deploy environment':
  stage: 'Deploy'
  tags: ['r10k']
  variables:
    GIT_SSH_COMMAND: 'ssh -o HostName=ssh.gitlab.eyrie. -o HostKeyAlias=gitlab.joyfullee.me'
  script:
    - 'export BOLT_PROJECT="$CI_PROJECT_DIR"'
    - 'bolt module install'
    - 'bolt plan run nest::puppet::deploy backend=kubernetes environment="$CI_COMMIT_BRANCH"'
  rules:
    - if: '$NEST_DAG_FIXTURE =~ /[\s\S]/'
      when: never
    - if: '$RELEASE_GRAPH =~ /[\s\S]/ || $RELEASE_GRAPH_FILE =~ /[\s\S]/ || $RELEASE_GRAPH_NODE =~ /[\s\S]/ || $RELEASE_GRAPH_MEMBER =~ /[\s\S]/ || $RELEASE_GRAPH_INPUT_PIPELINE =~ /[\s\S]/ || $RELEASE_GRAPH_INPUT_JOB =~ /[\s\S]/ || $RELEASE_GRAPH_INPUT_SHA256 =~ /[\s\S]/ || $RELEASE_GRAPH_ROOT_PIPELINE =~ /[\s\S]/'
      when: never
    - if: '$EXECUTOR_BOOTSTRAP =~ /[\s\S]/ || $RELEASE_BOOTSTRAP_FILE =~ /[\s\S]/ || $RELEASE_BOOTSTRAP_PIPELINE =~ /[\s\S]/ || $RELEASE_BOOTSTRAP_JOB =~ /[\s\S]/ || $RELEASE_BOOTSTRAP_SHA256 =~ /[\s\S]/'
      when: never
    - if: '$RELEASE_INPUTS'
      when: never
    - if: '$RELEASE_ROUTE =~ /[\s\S]/ || $RELEASE_ROUTE_MEMBER =~ /[\s\S]/ || $RELEASE_ROUTE_EXECUTOR_PIPELINE =~ /[\s\S]/ || $RELEASE_ROUTE_EXECUTOR_JOB =~ /[\s\S]/ || $RELEASE_ROUTE_PLACEMENT =~ /[\s\S]/'
      when: never
    - if: '$EXECUTOR_ONLY == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

'Deploy image':
  stage: 'Deploy'
  variables:
    IMAGE: "${CI_PROJECT_PATH}/${CI_COMMIT_REF_SLUG}"
  script:
    - 'podman login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" <<< $CI_REGISTRY_PASSWORD'
    - 'podman login -u admin --password-stdin registry.eyrie <<< $EYRIE_REGISTRY_PASSWORD'
    - 'LOCAL_IMAGE="${CI_REGISTRY_IMAGE}/${CI_COMMIT_REF_SLUG}:manifest-${CI_PIPELINE_ID}"'
    - 'cleanup() { podman manifest rm "$LOCAL_IMAGE" || true; }; trap cleanup EXIT'
    - 'podman manifest exists "$LOCAL_IMAGE" && podman manifest rm "$LOCAL_IMAGE"'
    - 'podman manifest create "$LOCAL_IMAGE"'
    - 'EXECUTOR_REFS=$(python3 bin/ci-executor-receipt refs executor-receipts)'
    - 'for reference in $EXECUTOR_REFS; do podman manifest add "$LOCAL_IMAGE" "docker://$reference" || exit; done'
    - 'podman manifest push --all "$LOCAL_IMAGE" "${CI_REGISTRY}/${IMAGE}:latest"'
    - 'mkdir compiler-candidates'
    - 'podman manifest push --all --digestfile compiler-candidates/index.digest "$LOCAL_IMAGE" "registry.eyrie/${IMAGE}:latest"'
    - 'if [ "$CI_COMMIT_BRANCH" = "main" ] && [ "$EXECUTOR_ONLY" != "true" ]; then python3 scripts/nest-compiler-candidate.py candidate executor-receipts "registry.eyrie/${IMAGE}@$(tr -d "\n" < compiler-candidates/index.digest)" compiler-candidates/candidate.json; fi'
  artifacts:
    when: on_success
    paths: ['compiler-candidates/']
  rules:
    - if: '$NEST_DAG_FIXTURE =~ /[\s\S]/'
      when: never
    - if: '$RELEASE_GRAPH =~ /[\s\S]/ || $RELEASE_GRAPH_FILE =~ /[\s\S]/ || $RELEASE_GRAPH_NODE =~ /[\s\S]/ || $RELEASE_GRAPH_MEMBER =~ /[\s\S]/ || $RELEASE_GRAPH_INPUT_PIPELINE =~ /[\s\S]/ || $RELEASE_GRAPH_INPUT_JOB =~ /[\s\S]/ || $RELEASE_GRAPH_INPUT_SHA256 =~ /[\s\S]/ || $RELEASE_GRAPH_ROOT_PIPELINE =~ /[\s\S]/'
      when: never
    - if: '$EXECUTOR_BOOTSTRAP =~ /[\s\S]/ || $RELEASE_BOOTSTRAP_FILE =~ /[\s\S]/ || $RELEASE_BOOTSTRAP_PIPELINE =~ /[\s\S]/ || $RELEASE_BOOTSTRAP_JOB =~ /[\s\S]/ || $RELEASE_BOOTSTRAP_SHA256 =~ /[\s\S]/'
      when: never
    - if: '$RELEASE_INPUTS'
      when: never
    - if: '$RELEASE_ROUTE =~ /[\s\S]/ || $RELEASE_ROUTE_MEMBER =~ /[\s\S]/ || $RELEASE_ROUTE_EXECUTOR_PIPELINE =~ /[\s\S]/ || $RELEASE_ROUTE_EXECUTOR_JOB =~ /[\s\S]/ || $RELEASE_ROUTE_PLACEMENT =~ /[\s\S]/'
      when: never
    - if: '$EXECUTOR_ONLY == "true" && $BUILD'
      when: never
    - if: '$EXECUTOR_ONLY == "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'


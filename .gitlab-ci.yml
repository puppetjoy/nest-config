---
# Probe branch only; do not merge. No publication, build, or deploy jobs.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "talon/homelab-ci-proof-probe"'
    - when: never

'CI evidence access probe':
  image: 'python:3.12-slim@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2'
  tags: ['owl']
  script:
    - |
      python3 - <<'PYPROBE'
      import os, urllib.error, urllib.request
      base = 'https://gitlab.joyfullee.me/api/v4/projects/3/'
      for suffix in ('merge_requests/806/pipelines', 'pipelines/13742/jobs', 'pipelines/13742/variables'):
          for label, headers in [('anonymous', {}), ('job-token', {'JOB-TOKEN': os.environ['CI_JOB_TOKEN']})]:
              req = urllib.request.Request(base + suffix, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=10) as response:
                      print(label, suffix, response.status)
              except urllib.error.HTTPError as exc:
                  print(label, suffix, exc.code)
      PYPROBE

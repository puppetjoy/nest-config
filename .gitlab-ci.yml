---
# Diagnostic branch only. No build, publication, or deployment.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "talon/archive-job-identity-probe"'
    - when: never

'Archive job identity probe':
  image: 'python:3.12-slim@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2'
  tags: ['owl']
  script:
    - |
      python3 -I -B - <<'PY'
      import hashlib
      import io
      import json
      import os
      import re
      import tarfile
      import urllib.request

      base = 'https://gitlab.joyfullee.me/api/v4'
      req = urllib.request.Request(base + '/job', headers={'JOB-TOKEN': os.environ['CI_JOB_TOKEN']})
      with urllib.request.urlopen(req, timeout=15) as response:
          job = json.load(response)
      pipeline = job['pipeline']
      sha = pipeline['sha']
      assert pipeline['project_id'] == 3 and job['name'] == 'Archive job identity probe'
      assert re.fullmatch(r'[0-9a-f]{40}', sha) and job['commit']['id'] == sha
      assert str(job['id']) == os.environ['CI_JOB_ID'] and sha == os.environ['CI_COMMIT_SHA']
      with urllib.request.urlopen(base + '/projects/3/repository/archive.tar.gz?sha=' + sha, timeout=30) as response:
          data = response.read(32 * 1024 * 1024 + 1)
      assert len(data) <= 32 * 1024 * 1024
      with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
          members = archive.getmembers()
          candidates = [item for item in members if item.isfile() and item.name.split('/', 1)[-1] == '.gitlab-ci.yml']
          assert len(candidates) == 1
          assert archive.extractfile(candidates[0]).read() == open('.gitlab-ci.yml', 'rb').read()
      print(json.dumps({'job': job['id'], 'pipeline': pipeline['id'], 'sha': sha,
                        'archive_bytes': len(data), 'archive_sha256': hashlib.sha256(data).hexdigest()}))
      PY
